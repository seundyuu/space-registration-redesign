<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공간 등록 개선 시안</title>
<!--FONT--><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable.min.css"><!--/FONT-->
<style>
/* 레이아웃: VT PARTNERS Admin 시안 그대로 — 상단 Navigation 60 / Sidebar 366 / GNB 60 + StepForm. 하단 고정 액션바만 추가.
   토큰: Figma 변수(460:1532) 그대로. ★ 표시는 접근성 기준을 맞추려고 추가·조정한 값 */
:root {
  --foreground: #0a0a0a;
  --primary: #171717;
  --primary-foreground: #fafafa;
  --muted-foreground: #737373;      /* white 4.74:1, sidebar 4.54:1 */
  --secondary: #f5f5f5;
  --border: #e5e5e5;
  --semantic-border: #a3a3a3;
  --input: #8f8f8f;                 /* ★ 입력란 테두리 3.3:1 (1.4.11) */
  --background: #ffffff;
  --sidebar: #fafafa;
  --accent: #2f6bff;                /* Space Type Card 선택색. white 대비 4.5:1 */
  --accent-bg: #f2f6ff;
  --accent-illust: #e9f0ff;
  --card-border: #e5e7eb;
  --illust-bg: #f7f8fa;
  --chip-text: #4b5563;
  --desc: #6b7280;
  --destructive: #dc2626;
  --focus: #2f6bff;
  --radius-xs: 2px; --radius-md: 8px; --radius-lg: 10px; --radius-card: 16px;
  --shadow-xs: 0 1px 2px rgba(0,0,0,.1);
  --font: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--background); color: var(--foreground); font: 400 14px/20px var(--font); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
img { display: block; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 16px; top: -60px; z-index: 50; background: var(--primary); color: var(--primary-foreground); padding: 8px 16px; border-radius: var(--radius-lg); text-decoration: none; }
.skip:focus { top: 12px; }

/* 텍스트 스타일 (Figma Text Styles) */
.t-3xl { font-size: 24px; line-height: 36px; font-weight: 600; color: var(--primary); letter-spacing: -0.01em; }
.t-base-sb { font-size: 16px; line-height: 24px; font-weight: 600; }
.t-sm { font-size: 14px; line-height: 20px; }
.t-sm-m { font-size: 14px; line-height: 20px; font-weight: 500; }
.t-sm-sb { font-size: 14px; line-height: 20px; font-weight: 600; }
.t-xs { font-size: 12px; line-height: 16px; }
.muted { color: var(--muted-foreground); }

/* Navigation */
.nav { height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 36px; border-bottom: 1px solid var(--border); background: var(--background); }
.logo { display: flex; align-items: flex-start; gap: 8px; }
.avatar { width: 34px; height: 34px; border-radius: 999px; background: var(--secondary); border: 1px solid var(--border); display: grid; place-items: center; }

/* 레이아웃 */
.shell { display: flex; min-height: calc(100vh - 60px); }
.sidebar { width: 366px; flex: none; background: var(--sidebar); padding: 36px 20px; display: flex; flex-direction: column; gap: 24px; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.gnb { height: 60px; display: flex; align-items: center; gap: 12px; padding: 0 20px; border-bottom: 1px solid var(--border); background: var(--background); }
.gnb .spacer { flex: 1; }
.stepform { padding: 36px 32px 0; display: flex; flex-direction: column; gap: 28px; }
.stepform.body { padding: 28px 32px 120px; flex: 1; }

/* Button (Figma: Buttons / Button) */
.btn { height: 36px; padding: 8px 16px; border-radius: var(--radius-lg); border: 1px solid transparent; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; line-height: 20px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.btn-primary { background: var(--foreground); color: var(--primary-foreground); box-shadow: 0 1px 1px rgba(0,0,0,.1); }
.btn-outline { background: var(--background); border-color: var(--border); box-shadow: var(--shadow-xs); border-radius: var(--radius-md); }
.btn-ghost { background: transparent; }
.btn-ghost:hover, .btn-outline:hover { background: var(--secondary); }
.btn-destructive { background: var(--destructive); color: #fff; }
.btn-lg { height: 44px; padding: 0 20px; }
.btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.icon-btn { width: 36px; height: 36px; padding: 0; border-radius: var(--radius-md); }

/* 스테퍼 (Figma: Frame 1739333684) */
.stepper { list-style: none; margin: 0; padding: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.stepper li { display: flex; align-items: center; gap: 6px; padding: 6px 0; font-size: 14px; line-height: 20px; color: var(--muted-foreground); white-space: nowrap; }
.stepper li + li::before { content: ""; width: 17px; height: 1px; background: var(--border); margin-right: 2px; }
.stepper .num { width: 24px; height: 24px; border-radius: 8px; background: var(--secondary); color: var(--muted-foreground); font-size: 12px; line-height: 16px; font-weight: 700; display: grid; place-items: center; }
.stepper li[aria-current="step"] { color: var(--foreground); font-weight: 600; }
.stepper li[aria-current="step"] .num { background: var(--accent); color: #fff; }
.stepper li.done { color: var(--foreground); }
.stepper li.done .num { background: var(--foreground); color: var(--primary-foreground); }

.title-block { display: flex; flex-direction: column; gap: 6px; }
.title-block h1 { margin: 0; }
.title-block p { margin: 0; }

/* Form (Figma: Wrapper / Select) */
.field { display: flex; flex-direction: column; gap: 12px; width: 460px; max-width: 100%; }
.field label { font-size: 14px; line-height: 20px; font-weight: 500; }
.req { color: var(--destructive); }
.input { height: 36px; padding: 4px 12px; border: 1px solid var(--input); border-radius: var(--radius-md); background: var(--background); font-size: 14px; line-height: 20px; width: 100%; }
.input::placeholder { color: var(--muted-foreground); }
.input:focus-visible { outline: none; border-color: var(--foreground); box-shadow: 0 0 0 3px rgba(10,10,10,.12); }
.input[aria-invalid="true"] { border-color: var(--destructive); }
.err { color: var(--destructive); font-size: 12px; line-height: 16px; display: flex; gap: 4px; align-items: center; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
.legend { font-size: 14px; line-height: 20px; font-weight: 500; margin-bottom: 12px; padding: 0; }

/* Space Type Card (Figma 460:1444 / 460:1472) */
.cards { display: flex; gap: 24px; flex-wrap: wrap; }
.type-card { position: relative; width: 345px; max-width: 100%; border: 1.5px solid var(--card-border); border-radius: var(--radius-card); background: #fff; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; }
.type-card input { position: absolute; inset: 0; opacity: 0; cursor: pointer; margin: 0; }
.type-card .illust { height: 130px; background: var(--illust-bg); position: relative; overflow: hidden; }
.type-card .map { position: absolute; left: 50%; top: 50%; width: 285px; height: 124px; transform: translate(-50%, -50%); }
.type-card .map > * { position: absolute; }
.type-card .map img { width: 100%; height: 100%; }
.type-card .map-label { font-size: 12.4px; line-height: 16.5px; font-weight: 600; color: var(--accent); white-space: nowrap; }
.type-card .multi-label { position: absolute; left: calc(50% + 90px); font-size: 12.4px; line-height: 16.5px; font-weight: 600; color: var(--desc); }
.type-card .multi-label.top { color: var(--accent); }
.type-card .body { padding: 8px 16px 16px; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; }
.type-card .name { font-size: 18.5px; line-height: 29px; font-weight: 600; color: #111; }
.type-card .desc { font-size: 12.4px; line-height: 16.5px; color: var(--desc); }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; padding-top: 4px; }
.chip { border: 1px solid var(--card-border); background: #fff; border-radius: 999px; padding: 3px 9px; font-size: 12.4px; line-height: 16.5px; color: var(--chip-text); }
.type-card:has(input:checked) { background: var(--accent-bg); border-color: var(--accent); }
.type-card:has(input:checked) .illust { background: var(--accent-illust); }
.type-card:has(input:focus-visible) { outline: 2px solid var(--focus); outline-offset: 3px; }
.type-card .check { display: none; z-index: 1; position: absolute; top: 12px; right: 12px; height: 24px; padding: 0 8px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 12px; font-weight: 700; align-items: center; gap: 4px; }
.type-card:has(input:checked) .check { display: inline-flex; }

/* 층수 조절 (Figma: Frame 1739333688, 순서만 − n +) */
.counter { display: flex; align-items: center; gap: 12px; }
.counter button { width: 36px; height: 36px; border-radius: var(--radius-md); background: var(--secondary); border: 1px solid var(--border); display: grid; place-items: center; cursor: pointer; }
.counter button:disabled { opacity: .4; cursor: not-allowed; }
.counter output { min-width: 28px; text-align: center; font-size: 16px; line-height: 24px; font-weight: 600; }
.check-row { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; min-height: 36px; font-size: 14px; }
.check-row input { width: 16px; height: 16px; accent-color: var(--foreground); margin: 0; }

/* ItemOrder (Figma 460:1335) */
.items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 16px; }
.item { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 20px; background: var(--background); border: 1px solid var(--border); border-radius: var(--radius-lg); text-align: left; cursor: pointer; }
.item[aria-current="true"] { border-color: var(--foreground); }
.item .lead { display: flex; align-items: center; gap: 14px; min-width: 0; }
.item .no { width: 28px; flex: none; text-align: center; background: var(--secondary); border-radius: var(--radius-xs); padding: 2px 0; font-size: 16px; line-height: 24px; font-weight: 600; }
.item .label { font-size: 16px; line-height: 24px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .marks { display: flex; gap: 10px; flex: none; }
.mark { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; line-height: 16px; color: var(--muted-foreground); }
.mark.off img { filter: grayscale(1); opacity: .55; }
.mark.on { color: var(--accent); font-weight: 600; }
.items.edit .item { cursor: default; padding: 8px 12px 8px 20px; }
.items.edit .input { height: 36px; flex: 1; min-width: 0; }
.order-btns { display: flex; gap: 4px; }
/* 지도 이름 = 지도 패널 제목에서 바로 수정 (인라인 편집) */
.title-edit { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 10px; margin-left: -10px; border: 1px solid transparent; border-radius: var(--radius-md); cursor: text; max-width: 100%; color: var(--muted-foreground); }
.title-edit input { border: 0; outline: 0; background: transparent; padding: 0; font-size: 16px; line-height: 24px; font-weight: 600; color: var(--foreground); min-width: 0; max-width: 100%; }
.title-edit input::placeholder { color: var(--muted-foreground); font-weight: 500; }
.title-edit:hover { border-color: var(--border); }
.title-edit:focus-within { border-color: var(--semantic-border); box-shadow: 0 0 0 3px rgba(161,161,161,.5); }
.title-edit.empty { border: 1px dashed var(--input); }
.title-edit.invalid { border: 1px solid var(--destructive); }
.title-hint { margin: 4px 24px 0; }
.add-map { width: 100%; height: 44px; border-style: dashed; border-color: var(--semantic-border); box-shadow: none; }

/* tip (Figma 460:1337) */
.tip { background: var(--background); border-radius: var(--radius-lg); padding: 24px 18px; display: flex; gap: 20px; align-items: center; justify-content: center; }
.tip p { margin: 0; color: var(--muted-foreground); }
.side-sec { display: flex; flex-direction: column; gap: 16px; }
.side-sec h2 { margin: 0; }
.flow { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.flow li { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--background); }
.flow .no { width: 24px; height: 24px; border-radius: 8px; flex: none; background: var(--secondary); display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--muted-foreground); }
.flow li[aria-current="step"] .no { background: var(--accent); color: #fff; }
.flow li[aria-current="step"] { border-color: var(--foreground); }
.progress { font-size: 12px; line-height: 16px; color: var(--muted-foreground); }

/* ── 아래부터 Figma에 없는 컴포넌트 = shadcn/ui 스펙 (Tabs, Card, Badge, Table, AlertDialog, Checkbox, RadioGroup, Sonner, Progress) ── */
/* shadcn Tabs: TabsList bg-muted h-9 p-[3px] rounded-lg / Trigger active bg-background shadow-sm rounded-md */
.tabs { display: inline-flex; align-items: center; gap: 0; height: 36px; padding: 3px; border-radius: var(--radius-lg); background: var(--secondary); max-width: 100%; overflow-x: auto; align-self: flex-start; }
.tab { height: 100%; padding: 4px 12px; border: 1px solid transparent; border-radius: var(--radius-md); background: none; cursor: pointer; font-size: 14px; line-height: 20px; font-weight: 500; color: var(--muted-foreground); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--background); color: var(--foreground); box-shadow: var(--shadow-xs); }
.tab .dot { width: 6px; height: 6px; border-radius: 99px; background: var(--semantic-border); }
.tab .dot.ok { background: var(--accent); }
/* shadcn Card: rounded-xl border shadow-sm, CardHeader px-6 / CardContent px-6 */
.panel { border: 1px solid var(--border); border-radius: 12px; background: var(--background); box-shadow: var(--shadow-xs); }
.panel + .panel { margin-top: 16px; }
.panel-head { display: flex; align-items: center; gap: 10px; padding: 20px 24px 0; flex-wrap: wrap; }
.panel-head h2 { margin: 0; display: flex; align-items: center; gap: 8px; }
.panel-head .spacer { flex: 1; }
.panel-body { padding: 16px 24px 24px; }
/* shadcn Badge: rounded-md px-2 py-0.5 text-xs font-medium — default / outline */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 6px; font-size: 12px; line-height: 16px; font-weight: 500; background: transparent; color: var(--foreground); border: 1px solid var(--border); white-space: nowrap; }
.badge.ok { background: var(--primary); color: var(--primary-foreground); border-color: transparent; }
#tp { display: flex; flex-direction: column; }
.step-no { width: 22px; height: 22px; border-radius: 6px; background: var(--foreground); color: var(--primary-foreground); font-size: 12px; font-weight: 700; display: grid; place-items: center; }
.drop { border: 1px dashed var(--semantic-border); border-radius: var(--radius-lg); background: var(--sidebar); padding: 32px 20px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.drop p { margin: 0 0 12px; }

.mapwrap { display: grid; grid-template-columns: minmax(0, 520px) minmax(180px, 1fr); gap: 24px; }
.floorplan { position: relative; aspect-ratio: 16 / 10; max-width: 100%; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--illust-bg); overflow: hidden; cursor: crosshair; }
.floorplan svg { width: 100%; height: 100%; display: block; }
.floorplan.idle { cursor: default; }
.pin { position: absolute; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 4px; pointer-events: none; }
.pin b { width: 22px; height: 22px; border-radius: 99px; background: var(--accent); color: #fff; font-size: 12px; display: grid; place-items: center; box-shadow: 0 0 0 3px rgba(47,107,255,.2); }
.pin span { font-size: 12px; font-weight: 600; background: #fff; border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px; white-space: nowrap; }
.pinlist h3 { margin: 0 0 8px; }
.pinlist ol { margin: 8px 0 0; padding-left: 18px; }
.pinlist p { margin: 0; }

.grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
.group-h { margin: 16px 0 8px; font-size: 12px; line-height: 16px; font-weight: 600; color: var(--muted-foreground); }
.group-h:first-child { margin-top: 0; }
.shot { border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; background: #fff; }
.shot[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.shot .ph { height: 100px; position: relative; }
.shot .ph .n { position: absolute; left: 8px; top: 8px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 99px; background: rgba(10,10,10,.75); color: #fff; font-size: 12px; font-weight: 600; display: grid; place-items: center; }
.shot .ph .cap { position: absolute; left: 10px; bottom: 8px; color: #fff; font-size: 13px; font-weight: 600; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
.shot .meta { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.shot .acts { display: flex; gap: 6px; }
.shot .acts .btn { flex: 1; height: 32px; padding: 0 8px; font-size: 13px; }
.shot .acts .icon-btn { flex: 0 0 32px; width: 32px; }

/* shadcn Table: th h-10 px-2 font-medium text-foreground / td p-2 / tr border-b hover:bg-muted/50 / caption-bottom muted */
.tbl-wrap { overflow-x: auto; padding: 8px 16px 16px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; line-height: 20px; caption-side: bottom; }
caption { margin-top: 16px; font-size: 14px; color: var(--muted-foreground); text-align: center; }
th, td { padding: 8px; text-align: left; white-space: nowrap; }
thead th { height: 40px; font-weight: 500; color: var(--foreground); }
tr { border-bottom: 1px solid var(--border); }
tbody tr:last-child { border-bottom: 0; }
tbody tr:hover { background: rgba(245,245,245,.5); }
tbody th { font-weight: 500; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
/* shadcn Progress: h-2 rounded-full bg-primary/20 — 미배치 구간은 빗금으로 색 외 구분 */
.bars { display: flex; flex-direction: column; gap: 14px; }
.bar { display: grid; grid-template-columns: 56px minmax(0, 1fr) 80px; gap: 12px; align-items: center; }
.track { height: 12px; border-radius: 999px; background: rgba(23,23,23,.08); display: flex; overflow: hidden; }
.fill-ok { background: var(--accent); }
.fill-no { background: repeating-linear-gradient(45deg, var(--semantic-border) 0 2px, transparent 2px 6px); }
.legend-row { display: flex; gap: 16px; margin-top: 12px; flex-wrap: wrap; }
.sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; vertical-align: -1px; margin-right: 6px; border: 1px solid var(--semantic-border); }
.radio-row { display: flex; align-items: flex-start; gap: 12px; padding: 14px 0; cursor: pointer; }
/* shadcn RadioGroupItem: size-4 rounded-full border-input shadow-xs, 선택 시 primary 점 */
.radio-row input { appearance: none; width: 16px; height: 16px; margin: 2px 0 0; flex: none; border: 1px solid var(--input); border-radius: 999px; box-shadow: var(--shadow-xs); display: grid; place-items: center; cursor: pointer; }
.radio-row input::after { content: ""; width: 8px; height: 8px; border-radius: 999px; background: var(--primary); transform: scale(0); }
.radio-row input:checked { border-color: var(--primary); }
.radio-row input:checked::after { transform: scale(1); }
/* shadcn Checkbox: size-4 rounded-[4px] border-input, 선택 시 bg-primary + 체크 */
.check-row input { appearance: none; width: 16px; height: 16px; flex: none; border: 1px solid var(--input); border-radius: 4px; box-shadow: var(--shadow-xs); display: grid; place-items: center; cursor: pointer; }
.check-row input:checked { background: var(--primary); border-color: var(--primary); }
.check-row input:checked::after { content: ""; width: 4px; height: 8px; border: solid var(--primary-foreground); border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }

/* 하단 액션바 */
.actionbar { position: sticky; bottom: 0; background: var(--background); border-top: 1px solid var(--border); padding: 12px 32px; display: flex; align-items: center; gap: 12px; }
.actionbar .msg { flex: 1; color: var(--muted-foreground); }

/* shadcn AlertDialog: max-w-lg rounded-lg border p-6 shadow-lg, overlay bg-black/50 */
dialog { border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; width: min(512px, calc(100% - 32px)); box-shadow: 0 10px 15px -3px rgba(0,0,0,.1), 0 4px 6px -4px rgba(0,0,0,.1); color: var(--foreground); }
dialog::backdrop { background: rgba(0,0,0,.5); }
dialog h2 { margin: 0 0 8px; font-size: 18px; line-height: 28px; font-weight: 600; }
dialog p { margin: 0 0 16px; color: var(--muted-foreground); }
.dlg-acts { display: flex; justify-content: flex-end; gap: 8px; }
.dlg-acts .btn { border-radius: var(--radius-md); }
/* shadcn Sonner: 우하단, bg-popover border shadow-lg rounded-lg */
.toast { position: fixed; right: 24px; bottom: 84px; min-width: 300px; max-width: calc(100% - 32px); background: var(--background); color: var(--foreground); border: 1px solid var(--border); box-shadow: 0 4px 12px rgba(0,0,0,.1); padding: 14px 16px; border-radius: var(--radius-lg); font-size: 14px; line-height: 20px; font-weight: 500; opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .2s; pointer-events: none; z-index: 30; }
.toast.show { opacity: 1; transform: none; }
.input:focus-visible { box-shadow: 0 0 0 3px rgba(161,161,161,.5); border-color: var(--semantic-border); }

@media (max-width: 900px) {
  .nav { padding: 0 16px; }
  .shell { flex-direction: column; }
  .sidebar { width: auto; padding: 20px 16px; }
  .tip { display: none; }
  .stepform { padding: 24px 16px 0; }
  .stepform.body { padding: 20px 16px 120px; }
  .actionbar { padding: 12px 16px; }
  .actionbar .msg { display: none; }
  .mapwrap { grid-template-columns: 1fr; }
  .type-card { width: 100%; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<a class="skip" href="#content">본문으로 건너뛰기</a>

<header class="nav">
  <span class="logo" role="img" aria-label="VT PARTNERS Admin">
    <img src="assets/logo-vtpartners.svg" width="134.478" height="14.5235" alt="">
    <img src="assets/logo-admin.svg" width="41.481" height="10.582" alt="" style="margin-top:2px">
  </span>
  <button class="avatar" type="button" aria-label="사용자 메뉴"><img src="assets/user-round.svg" width="24" height="24" alt=""></button>
</header>

<div class="shell">
  <aside class="sidebar" id="sidebar" aria-label="등록 현황"></aside>

  <main class="main">
    <div class="gnb">
      <a class="btn btn-outline icon-btn" href="#" aria-label="내 공간으로 돌아가기"><img src="assets/arrow-left.svg" width="16" height="16" alt=""></a>
      <span class="t-sm-sb">새 공간 만들기</span>
      <span class="spacer"></span>
      <button class="btn btn-ghost" type="button" id="saveDraft">임시 저장</button>
    </div>
    <div class="stepform" id="content" tabindex="-1">
      <nav aria-label="등록 단계"><ol class="stepper" id="stepper"></ol></nav>
      <div class="title-block" id="titleBlock"></div>
    </div>
    <div class="stepform body" id="view"></div>
    <div class="actionbar">
      <button class="btn btn-outline btn-lg" type="button" id="prevBtn">이전</button>
      <span class="msg t-sm" id="barMsg" aria-live="polite"></span>
      <button class="btn btn-primary btn-lg" type="button" id="nextBtn">다음</button>
    </div>
  </main>
</div>

<dialog id="dlg" aria-labelledby="dlgT" aria-describedby="dlgD">
  <h2 id="dlgT">이 사진을 삭제할까요?</h2>
  <p id="dlgD" class="t-sm"></p>
  <div class="dlg-acts">
    <button class="btn btn-outline" type="button" id="dlgCancel">취소</button>
    <button class="btn btn-destructive" type="button" id="dlgOk">삭제하기</button>
  </div>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script>
const STEPS = [
  { name: '공간 정보', hint: '이름과 크기' },
  { name: '지도 추가하기', hint: '층이나 구역마다 지도와 360이미지' },
  { name: '확인하기', hint: '빠진 게 없는지 보고 만들기' },
];
const SKY = [['#9cc8f0','#d9c8a6'],['#a9d2f2','#7f9a6a'],['#c3d9ef','#a07d5e'],['#8fbde8','#5f7f58'],['#b8d4ee','#8e8a80'],['#9fc3e6','#6d8f73']];
const NAMES = ['입구', '초입부', '카페 앞', '카페 내부', '테라스', '바베큐장', '캠핑사이트', '펜션 마당'];

// maps: 방문자 화면의 미니맵 한 장 = 지도 하나. 층·구역 구분 없이 이름은 관리자가 붙인다
const state = { step: 0, name: '', scale: null, maps: [], active: 0, sel: null, vis: 'private', touched: false, nameTouched: false };
let uid = 1;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const icon = (f, s = 20) => `<img src="assets/${f}.svg" width="${s}" height="${s}" alt="">`;

const newMap = () => ({ id: uid++, label: '', map: false, images: [] });
const placed = m => m.images.filter(i => i.pin).length;
const isSingle = () => state.scale === 'single';
const needsName = () => !isSingle() || state.maps.length > 1;
const named = m => !!m.label.trim();
const done = m => (named(m) || !needsName()) && m.map && m.images.length > 0 && placed(m) === m.images.length;
const dn = (m, i = state.maps.indexOf(m)) => named(m) ? m.label.trim() : needsName() ? `지도 ${i + 1}` : '지도';
const cur = () => state.maps[state.active];
// 비어 있으면 안내문 길이만큼, 채우면 글자 수만큼 제목 입력칸 너비를 맞춘다
const titleSize = v => v.trim() ? Math.max(4, [...v].length + 2) : 24;

/* ── 상단 ── */
function renderStepper() {
  $('#stepper').innerHTML = STEPS.map((s, i) => `<li class="${i < state.step ? 'done' : ''}"${i === state.step ? ' aria-current="step"' : ''}><span class="num" aria-hidden="true">${i < state.step ? '✓' : i + 1}</span>${s.name}<span class="sr-only">${i < state.step ? ' (완료)' : ''}</span></li>`).join('');
}
function renderTitle() {
  const t = [
    ['어떤 공간을 만들까요?', '이름과 크기만 정하면 돼요. 크기는 나중에 바꿀 수 있어요.'],
    needsName()
      ? ['지도를 추가해 주세요', '층이나 구역마다 지도를 한 장씩 만들어요. 붙인 이름은 방문자에게 그대로 보여요.']
      : ['지도와 360이미지를 올려주세요', '지도를 올리고 사진마다 위치를 찍으면 미니맵이 만들어져요.'],
    ['이대로 만들까요?', '만든 뒤에도 언제든 고칠 수 있어요.'],
  ][state.step];
  $('#titleBlock').innerHTML = `<h1 class="t-3xl" tabindex="-1">${esc(t[0])}</h1><p class="t-sm muted">${t[1]}</p>`;
}

/* ── 사이드바: 1단계엔 진행 순서만, 그다음부터 지도 목록(=ItemOrder) ── */
function renderSidebar() {
  const sb = $('#sidebar');
  if (state.step === 0) {
    sb.innerHTML = `
      <section class="side-sec" aria-labelledby="flowH">
        <h2 id="flowH" class="t-base-sb">이렇게 진행돼요</h2>
        <ol class="flow">${STEPS.map((s, i) => `<li${i === 0 ? ' aria-current="step"' : ''}><span class="no" aria-hidden="true">${i + 1}</span><span><span class="t-sm-sb">${s.name}</span><br><span class="t-xs muted">${s.hint}</span></span></li>`).join('')}</ol>
      </section>
      <div class="tip">${icon('lightbulb-ai', 32)}<p class="t-sm">한 번에 다 못 채워도 괜찮아요.<br>임시 저장하고 나중에 이어서 할 수 있어요.</p></div>`;
    return;
  }
  const n = state.maps.length, ok = state.maps.filter(done).length;
  sb.innerHTML = `
    <section class="side-sec" aria-labelledby="nameH">
      <h2 id="nameH" class="t-base-sb">공간 이름</h2>
      <div class="t-sm" style="display:flex;justify-content:space-between;align-items:center">${esc(state.name)}<button class="btn btn-ghost" type="button" data-goto-step="0" style="height:28px;padding:0 8px;font-size:13px">수정</button></div>
    </section>
    <section class="side-sec" aria-labelledby="zoneH">
      <h2 id="zoneH" class="t-base-sb">지도 ${n}장</h2>
      <p class="progress" style="margin:0">${n}장 중 ${ok}장 완료</p>
      <ul class="items">${state.maps.map((m, i) => `<li>
        <button class="item" type="button" data-map="${i}"${state.step === 1 && i === state.active ? ' aria-current="true"' : ''}>
          <span class="lead"><span class="no" aria-hidden="true">${i + 1}</span><span class="label"${named(m) || !needsName() ? '' : ' style="color:var(--muted-foreground);font-weight:500"'}>${esc(named(m) || !needsName() ? dn(m, i) : '이름 없음')}</span></span>
          <span class="marks">
            <span class="mark ${m.map ? 'on' : 'off'}">${icon('map-pin')}<span>${m.map ? '지도' : '지도 없음'}</span></span>
            <span class="mark ${m.images.length && placed(m) === m.images.length ? 'on' : 'off'}">${icon('photo-circle')}<span>${placed(m)}/${m.images.length}</span></span>
          </span>
        </button></li>`).join('')}</ul>
      ${isSingle() && n === 1 ? '' : `<button class="btn btn-outline add-map" type="button" id="addMapItem">${icon('plus', 16)}지도 추가</button>`}
    </section>
    <div class="tip">${icon('lightbulb-ai', 32)}<p class="t-sm">${state.step === 1 ? (needsName() ? '위에서부터 방문자에게<br>보이는 순서예요.' : '층이나 구역이 더 있으면<br>복합 공간으로 바꿔주세요.') : '다 못 채운 지도는<br>나중에 이어서 채울 수 있어요.'}</p></div>`;
}

/* ── 단계별 본문 ── */
function vBasics() {
  const e1 = state.touched && !state.name.trim(), e2 = state.touched && !state.scale;
  return `
  <div class="field">
    <label for="nameInput">공간 이름 <span class="req" aria-hidden="true">*</span></label>
    <input class="input" id="nameInput" autocomplete="off" aria-required="true" placeholder="예: 가평 휴밸리" value="${esc(state.name)}" aria-invalid="${e1}" aria-describedby="nameHint${e1 ? ' nameErr' : ''}">
    <span class="t-xs muted" id="nameHint">방문자에게 보이는 이름이에요. 30자까지 쓸 수 있어요.</span>
    ${e1 ? '<span class="err" id="nameErr">공간 이름을 알려주세요.</span>' : ''}
  </div>
  <fieldset${e2 ? ' aria-describedby="scaleErr"' : ''}>
    <legend class="legend">공간 크기 <span class="req" aria-hidden="true">*</span></legend>
    <div class="cards">
      ${typeCard('single', '단일 공간', '지도 1장에 모두 담기는 공간', ['카페', '진료실', '소형 매장', '원룸'], singleIllust())}
      ${typeCard('multi', '복합 공간', '층이나 구역마다 지도가 따로 필요한 공간', ['종합 병원', '상가 건물', '캠핑장'], multiIllust())}
    </div>
    ${e2 ? '<p class="err" id="scaleErr" style="margin-top:8px">공간 크기를 골라주세요.</p>' : ''}
  </fieldset>`;
}
function typeCard(v, name, desc, chips, illust) {
  return `<label class="type-card">
    <input type="radio" name="scale" value="${v}"${state.scale === v ? ' checked' : ''}>
    <span class="check" aria-hidden="true">✓ 선택</span>
    <div class="illust" aria-hidden="true">${illust}</div>
    <div class="body"><span class="name">${name}</span><span class="desc">${desc}</span>
      <span class="chips">${chips.map(c => `<span class="chip">${c}</span>`).join('')}</span></div>
  </label>`;
}
// Figma 460:1446 벡터 배치 그대로 (inset %)
function singleIllust() {
  const L = [
    ['v0', 'top:50%;right:50%;bottom:9.23%;left:20%'], ['v2', 'top:50%;right:20%;bottom:9.23%;left:50%'],
    ['v3', 'inset:15.38% 20%', '-0.99%'], ['v4', 'inset:34.42% 33.5% 44.81% 48.5%', '-2.64% -0.66%'],
    ['v5', 'inset:36.15% 51.5% 44.81% 32%', '-2.88% -0.72%'], ['v6', 'inset:31.69% 47.07% 54.77% 47.07%'],
    ['v7', 'inset:35.38% 48.67% 58.46% 48.67%'], ['v8', 'inset:47.08% 59.73% 39.38% 34.4%'],
    ['v7', 'inset:50.77% 61.33% 43.08% 36%'], ['v9', 'inset:53.23% 35.4% 33.23% 58.73%'],
    ['v7', 'inset:56.92% 37% 36.92% 60.33%'], ['v10', 'top:50%;bottom:50%;left:79.94%;right:15.39%', '-0.51px 0'],
  ];
  return `<div class="map" style="margin-left:1px;margin-top:-1px">${L.map(([f, pos, pad]) => pad
    ? `<div style="${pos}"><div style="position:absolute;inset:${pad}"><img src="assets/single/${f}.svg" alt="" style="width:100%;height:100%"></div></div>`
    : `<div style="${pos}"><img src="assets/single/${f}.svg" alt=""></div>`).join('')}
    <span class="map-label" style="inset:42.92% 3.39% 43.34% 86.1%">지도 1</span></div>`;
}
function multiIllust() {
  return `<div class="map" style="margin-left:1px;margin-top:-2px"><img src="assets/map-multi.svg" alt=""></div>
    <span class="multi-label top" style="top:calc(50% - 36px)">지도 3</span>
    <span class="multi-label" style="top:calc(50% - 10px)">지도 2</span>
    <span class="multi-label" style="top:calc(50% + 16px)">지도 1</span>`;
}

function vMaps() {
  const m = cur(), i = state.active, n = state.maps.length;
  const groups = []; for (let k = 0; k < m.images.length; k += 6) groups.push(m.images.slice(k, k + 6));
  const nameErr = state.nameTouched && !named(m);
  return `
  <section class="panel" aria-labelledby="${needsName() ? 'mapName' : 'mapH'}">
    <div class="panel-head">
      ${needsName() ? `<label class="title-edit${named(m) ? '' : ' empty'}${nameErr ? ' invalid' : ''}">
          <span class="sr-only">${i + 1}번째 지도 이름</span>
          <input id="mapName" autocomplete="off" aria-required="true" placeholder="지도 이름 (예: 1층, 캠핑 사이트)" value="${esc(m.label)}" size="${titleSize(m.label)}" aria-invalid="${nameErr}" aria-describedby="mapNameHint${nameErr ? ' mapNameErr' : ''}">
          <svg class="pencil" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.17 6.81a2.83 2.83 0 0 0-4-4L3.84 16.17a2 2 0 0 0-.5.83l-1.32 4.35a.5.5 0 0 0 .62.62l4.35-1.32a2 2 0 0 0 .83-.5z"/></svg>
        </label>` : '<h2 id="mapH" class="t-base-sb">지도 이미지</h2>'}
      <span class="badge${m.map ? ' ok' : ''}">${m.map ? '✓ 지도 있음' : '지도 없음'}</span><span class="spacer"></span>
      ${needsName() ? `<span class="order-btns">
        <button class="btn btn-outline icon-btn" type="button" data-move="-1" aria-label="이 지도를 위로 옮기기"${i === 0 ? ' disabled' : ''}>↑</button>
        <button class="btn btn-outline icon-btn" type="button" data-move="1" aria-label="이 지도를 아래로 옮기기"${i === n - 1 ? ' disabled' : ''}>↓</button>
      </span>${n > 1 ? '<button class="btn btn-ghost" type="button" id="delMap">지도 삭제</button>' : ''}` : ''}
    </div>
    ${needsName() ? `<p class="title-hint t-xs ${nameErr ? 'err' : 'muted'}" id="${nameErr ? 'mapNameErr' : 'mapNameHint'}">${nameErr ? '방문자에게 보일 이름을 붙여주세요.' : '이 이름이 방문자 화면에서 미니맵 이름으로 보여요.'}</p>` : ''}
    <div class="panel-body">${m.map ? mapView(m) + '<div style="margin-top:12px"><button class="btn btn-outline" type="button" id="rmMap">지도 이미지 바꾸기</button></div>' : `<div class="drop">${icon('map-pin', 32)}<span class="t-sm-sb">평면도나 약도를 올려주세요</span><p class="t-xs muted">PNG·JPG·PDF, 20MB까지 · 끌어다 놓아도 돼요</p><button class="btn btn-primary" type="button" id="addMap">파일 고르기</button></div>`}</div>
  </section>
  <section class="panel" aria-labelledby="imgH">
    <div class="panel-head"><h2 id="imgH" class="t-base-sb">360이미지</h2>
      <span class="badge${m.images.length ? ' ok' : ''}">${m.images.length}장</span><span class="spacer"></span>
      <button class="btn btn-outline" type="button" id="addImg">${icon('plus', 16)}360이미지 추가</button></div>
    <div class="panel-body">${m.images.length ? groups.map((g, gi) => `${groups.length > 1 ? `<h3 class="group-h">${gi * 6 + 1}–${gi * 6 + g.length}번</h3>` : ''}<ul class="grid">${g.map(shot).join('')}</ul>`).join('')
      : `<div class="drop">${icon('photo-circle', 32)}<span class="t-sm-sb">아직 360이미지가 없어요</span><p class="t-xs muted">여러 장을 한 번에 고를 수 있어요</p></div>`}</div>
  </section>`;
}
function shot(img) {
  const m = cur(), n = m.images.indexOf(img) + 1, sel = state.sel === img.id;
  return `<li class="shot"${sel ? ' aria-current="true"' : ''}>
    <div class="ph" style="background:linear-gradient(180deg,${img.c[0]} 0 55%,${img.c[1]} 55%)" role="img" aria-label="${esc(img.name)} 미리보기"><span class="n">${n}</span><span class="cap" aria-hidden="true">${esc(img.name)}</span></div>
    <div class="meta"><span class="badge${img.pin ? ' ok' : ''}" style="align-self:flex-start">${img.pin ? '✓ 위치 있음' : '위치 없음'}</span>
      <div class="acts">
        <button class="btn btn-outline" type="button" data-sel="${img.id}" aria-pressed="${sel}"${m.map ? '' : ' disabled title="지도 이미지를 먼저 올려주세요"'}>${sel ? '지도에서 고르는 중' : img.pin ? '위치 바꾸기' : '위치 찍기'}</button>
        <button class="btn btn-outline icon-btn" type="button" data-del="${img.id}" aria-label="${esc(img.name)} 삭제">🗑</button>
      </div></div></li>`;
}
function mapView(m) {
  const s = m.images.find(i => i.id === state.sel), pl = m.images.filter(i => i.pin);
  return `<div class="mapwrap">
    <div class="floorplan${s ? '' : ' idle'}" id="plan" role="application" tabindex="0" aria-describedby="pinlist"
      aria-label="${esc(dn(m))} 지도. ${s ? `‘${esc(s.name)}’ 위치를 지도에서 눌러주세요. Enter를 누르면 가운데에 찍혀요.` : '사진의 위치 찍기 버튼을 먼저 눌러주세요.'}">
      <svg viewBox="0 0 400 250" aria-hidden="true" fill="none" stroke="#9AAACB" stroke-width="3">
        <rect x="20" y="20" width="360" height="210" fill="#fff"/><path d="M160 20v120M20 140h100M260 100h120M260 100v130"/>
        <g fill="#737373" stroke="none" font-size="13" font-family="Pretendard Variable, sans-serif" text-anchor="middle">
          <text x="85" y="85">홀</text><text x="320" y="62">카페</text><text x="320" y="170">테라스</text><text x="200" y="195">복도</text></g>
      </svg>
      ${pl.map(i => `<div class="pin" style="left:${i.pin.x}%;top:${i.pin.y}%"><b>${m.images.indexOf(i) + 1}</b><span>${esc(i.name)}</span></div>`).join('')}
    </div>
    <div class="pinlist" id="pinlist">
      <h3 class="t-sm-sb">위치 찍은 사진 ${pl.length}/${m.images.length}</h3>
      <p class="t-xs muted">${s ? `‘${esc(s.name)}’ 위치를 지도에서 눌러주세요.` : m.images.length ? '사진에서 ‘위치 찍기’를 누르고 지도를 눌러주세요.' : '아래에서 360이미지를 먼저 추가해 주세요.'}</p>
      ${pl.length ? `<ol class="t-sm">${pl.map(i => `<li value="${m.images.indexOf(i) + 1}">${esc(i.name)}</li>`).join('')}</ol>` : ''}
    </div></div>`;
}

function vReview() {
  const max = Math.max(1, ...state.maps.map(m => m.images.length));
  return `
  <section class="panel" aria-labelledby="chH">
    <div class="panel-head"><h2 id="chH" class="t-base-sb">지도별로 위치를 찍은 사진</h2></div>
    <div class="panel-body">
      <div class="bars" role="img" aria-label="지도별로 위치를 찍은 사진 수. 아래 표와 같은 내용이에요.">
        ${state.maps.map((m, i) => { const p = placed(m), u = m.images.length - p; return `<div class="bar t-sm"><span class="t-sm-sb" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(dn(m, i))}</span>
          <div class="track"><div class="fill-ok" style="width:${p / max * 100}%"></div><div class="fill-no" style="width:${u / max * 100}%"></div></div>
          <span class="num">${p}/${m.images.length}장</span></div>`; }).join('')}
      </div>
      <div class="legend-row t-xs muted" aria-hidden="true"><span><i class="sw" style="background:var(--accent);border-color:var(--accent)"></i>위치 있음 (채움)</span><span><i class="sw" style="background:repeating-linear-gradient(45deg,var(--semantic-border) 0 2px,transparent 2px 6px)"></i>위치 없음 (빗금)</span></div>
    </div>
  </section>
  <section class="panel tbl-wrap">
    <table>
      <caption>지도별로 채운 내용 · 위에서부터 방문자에게 보이는 순서예요</caption>
      <thead><tr><th scope="col">지도 이름</th><th scope="col">지도 이미지</th><th scope="col" class="num">360이미지</th><th scope="col" class="num">위치 찍은 사진</th><th scope="col">상태</th><th scope="col"><span class="sr-only">작업</span></th></tr></thead>
      <tbody>${state.maps.map((m, i) => `<tr><th scope="row">${esc(dn(m, i))}</th><td>${m.map ? '있음' : '없음'}</td><td class="num">${m.images.length}장</td><td class="num">${placed(m)} / ${m.images.length}</td>
        <td><span class="badge${done(m) ? ' ok' : ''}">${done(m) ? '✓ 완료' : '채우는 중'}</span></td>
        <td class="num"><button class="btn btn-ghost" type="button" data-goto="${i}">${esc(dn(m, i))} 수정</button></td></tr>`).join('')}</tbody>
    </table>
  </section>
  <fieldset class="panel" style="padding:8px 20px">
    <legend class="sr-only">공개 설정</legend>
    <label class="radio-row"><input type="radio" name="vis" value="private"${state.vis === 'private' ? ' checked' : ''}><span><span class="t-sm-sb">나만 보기</span><br><span class="t-xs muted">확인하고 나서 내 공간에서 공개할 수 있어요.</span></span></label>
    <label class="radio-row" style="border-top:1px solid var(--border)"><input type="radio" name="vis" value="public"${state.vis === 'public' ? ' checked' : ''}><span><span class="t-sm-sb">모두에게 공개</span><br><span class="t-xs muted">방문자가 바로 가상투어를 볼 수 있어요.</span></span></label>
  </fieldset>`;
}

/* ── 액션바 ── */
function blocker() {
  if (state.step === 0) {
    const noName = !state.name.trim(), noScale = !state.scale;
    return noName && noScale ? '공간 이름과 크기를 알려주세요.' : noName ? '공간 이름을 알려주세요.' : noScale ? '공간 크기를 골라주세요.' : '';
  }
  if (state.step === 1) {
    const m = cur();
    if (needsName() && !named(m)) return '방문자에게 보일 지도 이름을 붙여주세요.';
    if (!m.map) return '지도 이미지를 올려주세요.';
    if (!m.images.length) return '360이미지를 추가해 주세요.';
    const u = m.images.length - placed(m);
    if (u) return `위치를 안 찍은 사진이 ${u}장 있어요. 나중에 찍어도 돼요.`;
  }
  if (state.step === 2) { const l = state.maps.filter(m => !done(m)).length; if (l) return `아직 다 못 채운 지도가 ${l}장 있어요. 나만 보기로 만들고 이어서 채워도 돼요.`; }
  return '';
}
function renderBar() {
  $('#prevBtn').hidden = state.step === 0;
  $('#nextBtn').textContent = state.step === 2 ? (state.vis === 'public' ? '만들고 공개하기' : '공간 만들기') : '다음';
  const m = blocker();
  $('#nextBtn').setAttribute('aria-disabled', state.step === 0 && !!m);
  $('#barMsg').textContent = m;
}
function render(focusTitle) {
  renderStepper(); renderTitle(); renderSidebar();
  $('#view').innerHTML = [vBasics, vMaps, vReview][state.step]();
  renderBar();
  if (focusTitle) $('#titleBlock h1').focus();
}
function go(step) { state.step = Math.max(0, Math.min(2, step)); state.sel = null; render(true); }
function openMap(i, focusSel) { state.active = i; state.step = 1; state.sel = null; render(); $(focusSel || `[data-map="${i}"]`)?.focus(); }

/* ── 이벤트 ── */
document.addEventListener('input', e => {
  if (e.target.id === 'nameInput') { state.name = e.target.value.slice(0, 30); renderBar(); }
  if (e.target.id === 'mapName') {
    const v = e.target.value.slice(0, 20), ok = !!v.trim(), box = e.target.closest('.title-edit'), hint = $('.title-hint');
    cur().label = v; e.target.size = titleSize(v);
    box.classList.toggle('empty', !ok);
    // 이름을 채우는 즉시 오류 표시를 거둔다
    if (ok && box.classList.contains('invalid')) {
      box.classList.remove('invalid'); e.target.setAttribute('aria-invalid', 'false'); e.target.setAttribute('aria-describedby', 'mapNameHint');
      hint.id = 'mapNameHint'; hint.className = 'title-hint t-xs muted'; hint.textContent = '이 이름이 방문자 화면에서 미니맵 이름으로 보여요.';
    }
    renderSidebar(); renderBar();
  }
});
document.addEventListener('change', e => {
  if (e.target.name === 'scale') { state.scale = e.target.value; if (!state.maps.length) state.maps.push(newMap()); renderBar(); }
  if (e.target.name === 'vis') { state.vis = e.target.value; renderBar(); }
});
document.addEventListener('click', e => {
  const t = e.target.closest('button, #plan, a[href="#"]');
  if (!t) return;
  if (t.matches('a[href="#"]')) { e.preventDefault(); toast('시안이라 이동하지 않아요'); return; }
  if (t.id === 'saveDraft') { toast('임시 저장했어요 (시안)'); return; }
  if (t.dataset.gotoStep) { go(+t.dataset.gotoStep); return; }
  if (t.dataset.map) { openMap(+t.dataset.map); return; }
  if (t.dataset.goto) { state.active = +t.dataset.goto; go(1); return; }
  if (t.id === 'addMapItem') {
    if (isSingle()) state.scale = 'multi';
    state.maps.push(newMap()); state.nameTouched = false;
    openMap(state.maps.length - 1, '#mapName'); toast('지도를 추가했어요. 이름부터 붙여주세요'); return;
  }
  if (t.dataset.move) {
    const i = state.active, j = i + +t.dataset.move, ms = state.maps; [ms[i], ms[j]] = [ms[j], ms[i]]; state.active = j; render();
    const same = $(`[data-move="${t.dataset.move}"]`); (same && !same.disabled ? same : $('[data-move]:not([disabled])'))?.focus(); return;
  }
  if (t.id === 'delMap') {
    const m = cur();
    confirmBox('이 지도를 삭제할까요?', `‘${dn(m)}’ 지도와 360이미지 ${m.images.length}장이 같이 지워져요.`, t, () => {
      state.maps.splice(state.active, 1); state.active = Math.max(0, state.active - 1); state.sel = null;
      render(); toast(`‘${dn(m)}’ 지도를 삭제했어요`); $(`[data-map="${state.active}"]`)?.focus();
    });
    return;
  }
  const m = cur();
  if (t.id === 'addMap') { m.map = true; render(); toast('지도 이미지를 올렸어요'); $('#addImg').focus(); return; }
  if (t.id === 'rmMap') { m.map = false; m.images.forEach(i => i.pin = null); state.sel = null; render(); $('#addMap').focus(); return; }
  if (t.id === 'addImg') {
    for (let k = 0; k < 3; k++) { const n = m.images.length; m.images.push({ id: uid++, name: NAMES[n % NAMES.length] + (n >= NAMES.length ? ' ' + (Math.floor(n / NAMES.length) + 1) : ''), pin: null, c: SKY[n % SKY.length] }); }
    render(); toast('360이미지 3장을 추가했어요'); $('#addImg').focus(); return;
  }
  if (t.dataset.sel) { const id = +t.dataset.sel; state.sel = state.sel === id ? null : id; render(); $('#plan')?.focus(); return; }
  if (t.dataset.del) {
    const img = m.images.find(i => i.id === +t.dataset.del);
    confirmBox('이 사진을 삭제할까요?', `‘${img.name}’ 사진과 지도에 찍은 위치가 같이 지워져요.`, t, () => {
      m.images.splice(m.images.indexOf(img), 1); if (state.sel === img.id) state.sel = null;
      render(); toast(`‘${img.name}’ 사진을 삭제했어요`); $('#addImg').focus();
    });
    return;
  }
  if (t.id === 'plan' && state.sel) { const r = t.getBoundingClientRect(); pin((e.clientX - r.left) / r.width * 100, (e.clientY - r.top) / r.height * 100); }
});
document.addEventListener('keydown', e => {
  if (e.target.id === 'plan' && (e.key === 'Enter' || e.key === ' ') && state.sel) { e.preventDefault(); pin(50, 50); }
});
function pin(x, y) {
  const m = cur(), img = m.images.find(i => i.id === state.sel);
  img.pin = { x: Math.max(6, Math.min(90, x)), y: Math.max(8, Math.min(92, y)) };
  const nx = m.images.find(i => !i.pin); state.sel = nx ? nx.id : null;
  render(); toast(`‘${img.name}’ 위치를 찍었어요${nx ? ` · 다음은 ‘${nx.name}’` : ''}`); $('#plan')?.focus();
}

/* AlertDialog: 네이티브 dialog로 포커스 트랩·Esc, 닫히면 원래 버튼으로 포커스 복귀 */
let onOk = null, back = null;
function confirmBox(title, desc, opener, ok) {
  $('#dlgT').textContent = title; $('#dlgD').textContent = desc;
  onOk = ok; back = opener;
  $('#dlg').showModal(); $('#dlgCancel').focus();
}
$('#dlgCancel').onclick = () => $('#dlg').close();
$('#dlgOk').onclick = () => { back = null; $('#dlg').close(); onOk?.(); };
$('#dlg').addEventListener('close', () => back?.focus());

$('#prevBtn').onclick = () => go(state.step - 1);
$('#nextBtn').onclick = () => {
  if (state.step === 0 && blocker()) { state.touched = true; render(); (!state.name.trim() ? $('#nameInput') : $('input[name="scale"]')).focus(); return; }
  if (state.step === 1 && needsName()) {
    const i = state.maps.findIndex(m => !named(m));
    if (i >= 0) { state.nameTouched = true; openMap(i, '#mapName'); toast('방문자에게 보일 지도 이름을 붙여주세요'); return; }
  }
  if (state.step === 2) return toast(`‘${state.name}’ 공간을 만들었어요 (시안)`);
  go(state.step + 1);
};
let tt;
function toast(m) { const el = $('#toast'); el.textContent = m; el.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 2400); }

render();
</script>
</body>
</html>
