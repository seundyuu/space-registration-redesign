<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 공간 개선 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
/* 내 공간 = 운영 화면(/space)과 같은 카드 목록. 등록(index.html)·편집(edit.html)의 출발점이자 돌아오는 곳 */
:root {
  --foreground: #0a0a0a; --primary: #171717; --primary-foreground: #fafafa; --muted-foreground: #737373;
  --secondary: #f5f5f5; --border: #e5e5e5; --semantic-border: #a3a3a3; --background: #fff; --accent: #2f6bff; --focus: #2f6bff;
  --radius-md: 8px; --radius-lg: 10px; --shadow-xs: 0 1px 2px rgba(0,0,0,.1);
  --font: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--background); color: var(--foreground); font: 400 14px/20px var(--font); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.nav { height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 36px; border-bottom: 1px solid var(--border); }
.logo { display: flex; align-items: flex-start; gap: 8px; }
.avatar { width: 34px; height: 34px; border-radius: 999px; background: var(--secondary); border: 1px solid var(--border); display: grid; place-items: center; }
main { padding: 32px 36px 64px; max-width: 1440px; }
.head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
.head h1 { margin: 0; font-size: 24px; line-height: 36px; font-weight: 600; }
.muted { color: var(--muted-foreground); }
.grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
.card { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--background); display: flex; flex-direction: column; }
.card a { color: inherit; text-decoration: none; display: block; }
.thumb { display: block; height: 140px; position: relative; }
.vis { white-space: nowrap; position: absolute; left: 10px; top: 10px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: rgba(10,10,10,.8); color: #fff; }
.body { padding: 12px 14px 14px; display: flex; align-items: center; gap: 8px; }
.body .t { flex: 1; min-width: 0; display: block; }
.body b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.add { border-style: dashed; border-color: var(--semantic-border); align-items: center; justify-content: center; min-height: 206px; text-align: center; gap: 6px; }
.add .plus { width: 40px; height: 40px; border-radius: 999px; background: var(--secondary); display: grid; place-items: center; margin: 0 auto 8px; font-size: 20px; }
.add a { padding: 24px; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; }
.btn { height: 32px; padding: 0 12px; border-radius: var(--radius-md); border: 1px solid var(--border); background: var(--background); box-shadow: var(--shadow-xs); font-size: 13px; font-weight: 500; text-decoration: none; display: inline-flex; align-items: center; }
.btn:hover { background: var(--secondary); }
.card:hover { border-color: var(--semantic-border); }
@media (max-width: 600px) { .nav { padding: 0 16px; } main { padding: 20px 16px 48px; } }
</style>
</head>
<body>
<header class="nav">
  <span class="logo" role="img" aria-label="VT PARTNERS Admin">
    <img src="assets/logo-vtpartners.svg" width="134.478" height="14.5235" alt="">
    <img src="assets/logo-admin.svg" width="41.481" height="10.582" alt="" style="margin-top:2px">
  </span>
  <button class="avatar" type="button" aria-label="사용자 메뉴"><img src="assets/user-round.svg" width="24" height="24" alt=""></button>
</header>
<main>
  <div class="head"><h1>내 공간</h1><span class="muted">공간을 누르면 편집 화면이 열려요.</span></div>
  <ul class="grid">
    <li class="card add"><a href="./"><span class="plus" aria-hidden="true">+</span><b>새 공간 만들기</b><span class="muted" style="font-size:13px">이름과 크기부터 정해요</span></a></li>
    <li class="card">
      <a href="edit.html?name=%EA%B0%80%ED%8F%89%20%ED%9C%B4%EB%B0%B8%EB%A6%AC"><span class="thumb" style="background:#ddd url(assets/pano/living-s.jpg) center/cover" aria-hidden="true"><span class="vis">나만 보기</span></span>
        <span class="body"><span class="t"><b>가평 휴밸리</b><span class="muted" style="font-size:12px">지도 2장 · 360 사진 5장</span></span></span></a>
    </li>
    <li class="card">
      <a href="edit.html?name=%EC%84%B1%EC%95%88%EA%B5%90%ED%9A%8C"><span class="thumb" style="background:linear-gradient(#a9d2f2 55%,#6d8f73 55%)" aria-hidden="true"><span class="vis">나만 보기</span></span>
        <span class="body"><span class="t"><b>성안교회</b><span class="muted" style="font-size:12px">지도 1장 · 360 사진 18장</span></span></span></a>
    </li>
  </ul>
</main>
</body>
</html>
