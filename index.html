<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공간 등록 개선 시안</title>
<!--FONT--><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable.min.css"><!--/FONT-->
<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
<style>
/* 레이아웃: VT PARTNERS Admin 시안 그대로 — 상단 Navigation 60 / Sidebar 312 / GNB 60 + StepForm. 하단 고정 액션바만 추가.
   토큰: Figma 변수(460:1532) 그대로. ★ 표시는 접근성 기준을 맞추려고 추가·조정한 값 */
:root {
  --foreground: #0a0a0a;
  --primary: #171717;
  --primary-foreground: #fafafa;
  --muted-foreground: #737373;      /* white 4.74:1, sidebar 4.54:1 */
  --secondary: #f5f5f5;
  --border: #e5e5e5;
  --semantic-border: #a3a3a3;
  --input: #8f8f8f;                 /* ★ 입력란 테두리 3.3:1 (1.4.11) */
  --background: #ffffff;
  --sidebar: #fafafa;
  --accent: #2f6bff;                /* Space Type Card 선택색. white 대비 4.5:1 */
  --accent-bg: #f2f6ff;
  --accent-illust: #e9f0ff;
  --card-border: #e5e7eb;
  --illust-bg: #f7f8fa;
  --chip-text: #4b5563;
  --desc: #6b7280;
  --destructive: #dc2626;
  --focus: #2f6bff;
  --radius-xs: 2px; --radius-md: 8px; --radius-lg: 10px; --radius-card: 16px;
  --shadow-xs: 0 1px 2px rgba(0,0,0,.1);
  --font: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--background); color: var(--foreground); font: 400 14px/20px var(--font); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
img { display: block; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 16px; top: -60px; z-index: 50; background: var(--primary); color: var(--primary-foreground); padding: 8px 16px; border-radius: var(--radius-lg); text-decoration: none; }
.skip:focus { top: 12px; }

/* 텍스트 스타일 (Figma Text Styles) */
.t-3xl { font-size: 24px; line-height: 36px; font-weight: 600; color: var(--primary); letter-spacing: -0.01em; }
.t-base-sb { font-size: 16px; line-height: 24px; font-weight: 600; }
.t-sm { font-size: 14px; line-height: 20px; }
.t-sm-m { font-size: 14px; line-height: 20px; font-weight: 500; }
.t-sm-sb { font-size: 14px; line-height: 20px; font-weight: 600; }
.t-xs { font-size: 12px; line-height: 16px; }
.muted { color: var(--muted-foreground); }

/* Navigation */
.nav { height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 36px; border-bottom: 1px solid var(--border); background: var(--background); }
.logo { display: flex; align-items: flex-start; gap: 8px; }
.avatar { width: 34px; height: 34px; border-radius: 999px; background: var(--secondary); border: 1px solid var(--border); display: grid; place-items: center; padding: 0; cursor: pointer; }

/* 레이아웃 */
.shell { display: flex; min-height: calc(100vh - 60px); }
.sidebar { width: 312px; flex: none; background: var(--sidebar); padding: 18px 20px 36px; /* '진행 순서'를 오른쪽 '새 공간 만들기'와 같은 줄에 */ display: flex; flex-direction: column; gap: 24px; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.gnb { height: 60px; display: flex; align-items: center; gap: 12px; padding: 0 20px; border-bottom: 1px solid var(--border); background: var(--background); }
.gnb .spacer { flex: 1; }
.gnb .t-sm-sb { font-size: 16px; }
.btn.back-btn { width: 32px; height: 32px; margin-right: -6px; color: #404040; }
.stepform { padding: 20px 32px 0; display: flex; flex-direction: column; gap: 28px; }
.stepform.body { padding: 28px 32px 120px; flex: 1; }

/* Button (Figma: Buttons / Button) */
.btn { height: 36px; padding: 8px 16px; border-radius: var(--radius-lg); border: 1px solid transparent; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; line-height: 20px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.btn-primary { background: var(--foreground); color: var(--primary-foreground); box-shadow: 0 1px 1px rgba(0,0,0,.1); }
.btn-outline { background: var(--background); border-color: var(--border); box-shadow: var(--shadow-xs); border-radius: var(--radius-md); }
.btn-ghost { background: transparent; }
.btn-flat { box-shadow: none; }
.btn-ghost:hover, .btn-outline:hover { background: var(--secondary); }
.btn-destructive { background: var(--destructive); color: #fff; }
.btn-lg { height: 44px; padding: 0 20px; }
.btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.icon-btn { width: 36px; height: 36px; padding: 0; border-radius: var(--radius-md); }

/* 스테퍼 (Figma: Frame 1739333684) */
.stepper { list-style: none; margin: 0; padding: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.stepper li { display: flex; align-items: center; gap: 6px; padding: 6px 0; font-size: 14px; line-height: 20px; color: var(--muted-foreground); white-space: nowrap; }
.stepper li + li::before { content: ""; width: 17px; height: 1px; background: var(--border); margin-right: 2px; }
.stepper .num { width: 24px; height: 24px; border-radius: 8px; background: var(--secondary); color: var(--muted-foreground); font-size: 12px; line-height: 16px; font-weight: 700; display: grid; place-items: center; padding: 0; cursor: pointer; }
.stepper .step-btn { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 4px 6px; margin: 0 -6px; border-radius: 6px; cursor: pointer; color: inherit; font: inherit; }
.stepper .step-btn:hover { background: var(--secondary); }
.stepper li[aria-current="step"] { color: var(--foreground); font-weight: 600; }
.stepper li[aria-current="step"] .num { background: var(--accent); color: #fff; }
.stepper li.done { color: var(--foreground); font-weight: 600; }
.stepper li.done .num { background: var(--foreground); color: var(--primary-foreground); }

.title-block { display: flex; flex-direction: column; gap: 6px; }
.title-block h1 { margin: 0; }
.title-block h1:focus { outline: none; }
.title-block p { margin: 0; }

/* Form (Figma: Wrapper / Select) */
.field { display: flex; flex-direction: column; gap: 12px; width: 460px; max-width: 100%; }
.field label { font-size: 14px; line-height: 20px; font-weight: 500; }
.req { color: var(--destructive); }
.input { height: 36px; padding: 4px 12px; border: 1px solid var(--input); border-radius: var(--radius-md); background: var(--background); font-size: 14px; line-height: 20px; width: 100%; }
.input::placeholder { color: var(--muted-foreground); }
.input:focus-visible { outline: none; border-color: var(--foreground); box-shadow: 0 0 0 3px rgba(10,10,10,.12); }
.input[aria-invalid="true"] { border-color: var(--destructive); }
.err { color: var(--destructive); font-size: 12px; line-height: 16px; display: flex; gap: 4px; align-items: center; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
.legend { font-size: 14px; line-height: 20px; font-weight: 500; margin-bottom: 12px; padding: 0; }

/* Space Type Card (Figma 460:1444 / 460:1472) */
.cards { display: flex; gap: 24px; flex-wrap: wrap; }
.type-card { position: relative; width: 345px; max-width: 100%; border: 1.5px solid var(--card-border); border-radius: var(--radius-card); background: #fff; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; }
.type-card input { position: absolute; inset: 0; opacity: 0; cursor: pointer; margin: 0; }
.type-card .illust { height: 130px; background: var(--illust-bg); position: relative; overflow: hidden; }
.type-card .map { position: absolute; left: 50%; top: 50%; width: 285px; height: 124px; transform: translate(-50%, -50%); }
.type-card .map > * { position: absolute; }
.type-card .map img { width: 100%; height: 100%; }
.type-card .map-label { font-size: 12.4px; line-height: 16.5px; font-weight: 600; color: var(--accent); white-space: nowrap; }
.type-card .multi-label { position: absolute; left: calc(50% + 90px); font-size: 12.4px; line-height: 16.5px; font-weight: 600; color: var(--desc); }
.type-card .multi-label.top { color: var(--accent); }
.type-card .body { padding: 8px 16px 16px; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; }
.type-card .name { font-size: 18.5px; line-height: 29px; font-weight: 600; color: #111; }
.type-card .desc { font-size: 12.4px; line-height: 16.5px; color: var(--desc); }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; padding-top: 4px; }
.chip { display: inline-flex; align-items: center; border: 1px solid var(--card-border); background: #fff; border-radius: 999px; padding: 3px 9px; font-size: 12.4px; line-height: 16.5px; color: var(--chip-text); }
.type-card:has(input:checked) { background: var(--accent-bg); border-color: var(--accent); outline: 2px solid var(--accent); outline-offset: -2px; }
.type-card:has(input:checked) .illust { background: var(--accent-illust); }
.type-card:has(input:focus-visible:not(:checked)) { outline: 2px solid var(--focus); outline-offset: 3px; }
.type-card .check { display: none; z-index: 1; position: absolute; top: 12px; right: 12px; height: 24px; padding: 0 8px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 12px; font-weight: 700; align-items: center; gap: 4px; }
.type-card:has(input:checked) .check { display: inline-flex; }

/* 층수 조절 (Figma: Frame 1739333688, 순서만 − n +) */
.counter { display: flex; align-items: center; gap: 12px; }
.counter button { width: 36px; height: 36px; border-radius: var(--radius-md); background: var(--secondary); border: 1px solid var(--border); display: grid; place-items: center; cursor: pointer; }
.counter button:disabled { opacity: .4; cursor: not-allowed; }
.counter output { min-width: 28px; text-align: center; font-size: 16px; line-height: 24px; font-weight: 600; }
.check-row { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; min-height: 36px; font-size: 14px; }
.check-row input { width: 16px; height: 16px; accent-color: var(--foreground); margin: 0; }

/* ItemOrder (Figma 460:1335) */
.items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 16px; }
.item { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 20px; background: var(--background); border: 1px solid var(--border); border-radius: var(--radius-lg); text-align: left; cursor: pointer; }
.item[aria-current="true"] { border-color: var(--foreground); }
.item .lead { display: flex; align-items: center; gap: 14px; min-width: 0; }
.item .no { width: 28px; flex: none; text-align: center; background: var(--secondary); border-radius: var(--radius-xs); padding: 2px 0; font-size: 16px; line-height: 24px; font-weight: 600; }
.item .label { font-size: 16px; line-height: 24px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .marks { display: flex; gap: 10px; flex: none; }
.mark { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; line-height: 16px; color: var(--muted-foreground); }
.mark.off img { filter: grayscale(1); opacity: .55; }
.mark.on { color: var(--accent); font-weight: 600; }
.items.edit .item { cursor: default; padding: 8px 12px 8px 20px; }
.items.edit .input { height: 36px; flex: 1; min-width: 0; }
.order-btns { display: flex; gap: 4px; }
/* 지도 이름 = 지도 패널 제목에서 바로 수정 (인라인 편집) */
.title-edit { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border: 1px solid transparent; border-radius: var(--radius-md); cursor: text; max-width: 100%; color: var(--muted-foreground); }
.title-edit input { border: 0; outline: 0; background: transparent; padding: 0; font-size: 16px; line-height: 24px; font-weight: 600; color: var(--foreground); min-width: 0; max-width: 100%; }
.title-edit input::placeholder { color: var(--muted-foreground); font-weight: 500; }
.title-edit:hover { border-color: var(--border); }
.title-edit:focus-within { border-color: var(--semantic-border); box-shadow: 0 0 0 3px rgba(161,161,161,.5); }
.title-edit.empty { border: 1px dashed var(--input); }
/* 입력을 마친 이름은 제목처럼 — 글자를 패널 여백(24px)에 맞춘다. 비어 있거나 수정 중일 땐 입력칸 테두리를 여백에 맞춘다 */
.title-edit:not(.empty):not(:focus-within) { margin-left: -13px; }
.title-edit.invalid { border: 1px solid var(--destructive); }
.title-hint { margin: 4px 24px 0; }
/* 지도 작업공간: 왼쪽 지도(스크롤해도 고정) + 오른쪽 사진 목록 */
.ws { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(300px, 1fr); grid-template-areas: "mh lh" "map list"; column-gap: 24px; row-gap: 10px; }
/* 위 줄(범례 | 목록 머리)과 아래 줄(지도 | 목록)로 나눠, 지도 상자와 목록 상자의 위·아래 선을 맞춘다 */
.ws-mhead { grid-area: mh; display: flex; align-items: center; min-height: 36px; }
.ws-lhead { grid-area: lh; }
.ws-map { grid-area: map; position: relative; }
.ws-list { grid-area: list; display: flex; flex-direction: column; gap: 8px; height: 0; min-height: 100%; overflow-y: auto; padding-right: 4px; }
.ws-list-head { display: flex; align-items: center; gap: 10px; min-height: 36px; }
.ws-list-head h3 { flex: 1; min-width: 0; }
.ws-list-head .del-sel { height: 36px; padding: 0 12px; color: var(--destructive); }
.ws-prog { display: inline-flex; align-items: center; gap: 6px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ws-prog i { width: 48px; height: 4px; border-radius: 99px; background: var(--secondary); overflow: hidden; display: block; }
.ws-prog b { display: block; height: 100%; background: var(--accent); border-radius: inherit; }
.ws-prog.done { color: var(--accent); font-weight: 600; }
.row-btn.todo { color: var(--accent); border-color: #c9d8ff; background: var(--accent-bg); }
.row-btn.todo:hover { background: #e3ecff; }
.ws-list-head h3 { margin: 0; }
/* 360이미지 빈 상태: 지도와 같은 높이로 채우고, 할 일은 '사진 고르기' 하나로(예시는 보조) */
.ws-list.is-empty { overflow: visible; padding-right: 0; }
.drop.img-empty { flex: 1; justify-content: center; gap: 6px; padding: 32px 24px; }
.drop.img-empty p { margin: 0; }
.img-empty-ico { width: 52px; height: 52px; border-radius: 14px; background: var(--accent-bg); color: var(--accent); display: grid; place-items: center; margin-bottom: 6px; }
.drop .img-empty-note { margin-top: 6px; color: var(--accent); font-weight: 600; }
.img-empty-cta { margin-top: 14px; min-width: 160px; }
.img-empty-demo { color: var(--muted-foreground); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }
.ws-list p { margin: 0; }
.sel-guide { color: var(--accent); font-weight: 600; }
.rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.row { display: flex; align-items: center; gap: 10px; padding: 8px; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--background); }
.row[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); background: var(--accent-bg); }
.row-th { width: 44px; height: 44px; border-radius: 8px; flex: none; position: relative; }
.row-th b { position: absolute; left: 4px; top: 4px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 99px; background: rgba(10,10,10,.8); color: #fff; font-size: 12px; display: grid; place-items: center; padding: 0; cursor: pointer; }
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.row-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ok-text { color: var(--accent); font-weight: 600; }
.row-btn { height: 36px; padding: 0 12px; flex: none; }
.row-del { color: var(--muted-foreground); }
.row-del:hover { color: var(--destructive); }
.group-h { margin: 8px 0 0; }
/* 키보드로 위치를 고를 때 보이는 십자선 */
.cross { position: absolute; width: 28px; height: 28px; transform: translate(-50%, -50%); border: 2px solid var(--accent); border-radius: 99px; background: rgba(47,107,255,.15); pointer-events: none; }
.cross::before, .cross::after { content: ""; position: absolute; background: var(--accent); }
.cross::before { left: 50%; top: -8px; bottom: -8px; width: 2px; transform: translateX(-50%); }
.cross::after { top: 50%; left: -8px; right: -8px; height: 2px; transform: translateY(-50%); }
.floorplan:not(:focus-visible) .cross { opacity: .5; }
/* 직접 찍은 핀은 속이 빈 원, GPS로 찍힌 핀은 채운 원 — 색 외에 모양으로도 구분 */
.pin.manual b { background: #fff; color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent), 0 0 0 3px rgba(47,107,255,.2); }
.map-legend { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; margin: 0; }
.map-legend i { display: inline-block; width: 12px; height: 12px; border-radius: 99px; vertical-align: -1px; margin-right: 4px; }
/* shadcn DropdownMenu */
.menu-wrap { position: relative; }
.menu { position: absolute; right: 0; top: calc(100% + 4px); z-index: 20; min-width: 168px; padding: 4px; background: var(--background); border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: 0 4px 12px rgba(0,0,0,.1); display: flex; flex-direction: column; }
.menu [role="menuitem"] { height: 36px; padding: 0 8px; border: 0; background: none; border-radius: 4px; text-align: left; font-size: 14px; cursor: pointer; }
.menu [role="menuitem"]:hover, .menu [role="menuitem"]:focus-visible { background: var(--secondary); outline: none; }
.menu [role="menuitem"][aria-disabled="true"] { color: var(--muted-foreground); cursor: not-allowed; }
.menu .danger { color: var(--destructive); }
.menu-sep { height: 1px; background: var(--border); margin: 4px -4px; }
.floorplan.real { cursor: default; }
.nmap-slot, .nmap { position: absolute; inset: 0; }
.floorplan.real .cross { z-index: 5; }
.plan-img { width: 100%; height: 100%; object-fit: contain; display: block; background: #fff; }
.pin.static { position: relative; transform: translate(-0px, 0); }
.nv-note { position: absolute; left: 8px; right: 8px; top: 8px; z-index: 6; margin: 0; padding: 8px 12px; box-shadow: 0 1px 3px rgba(0,0,0,.12); border-radius: var(--radius-md); background: var(--secondary); color: var(--foreground); }
.drop.over { border-color: var(--accent); background: var(--accent-bg); }
.src-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
/* 지도 방식 고르기: 이름 입력과 선으로 나눠 질문 하나씩, 카드는 아이콘 · (이름+추천) · 얻는 것 · 맞는 곳 */
.src-sec.split { border-top: 1px solid var(--border); margin-top: 4px; padding-top: 20px; }
.src-sec-h { margin: 0; }
.src-sec-sub { margin: 4px 0 14px; }
.src-card { display: flex; align-items: center; gap: 14px; padding: 18px 16px 18px 18px; text-align: left; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--background); cursor: pointer; }
.src-card:hover { border-color: var(--foreground); }
.src-card:hover .src-go { color: var(--foreground); transform: translateX(2px); }
.src-ico { flex: none; width: 44px; height: 44px; border-radius: 12px; background: var(--secondary); display: grid; place-items: center; }
.src-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.src-title { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
.src-rec { font-size: 12px; line-height: 16px; font-weight: 600; color: var(--accent); background: var(--accent-bg); border-radius: 6px; padding: 2px 6px; }
.src-go { flex: none; font-size: 22px; line-height: 1; color: var(--semantic-border); transition: transform .12s, color .12s; }
.name-chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 24px 0; }
.name-chips .chip { height: 32px; padding: 0 12px; border-color: var(--border); background: var(--background); font-size: 13px; color: var(--foreground); cursor: pointer; }
.name-chips .chip:hover { border-color: var(--foreground); }
.add-map { width: 100%; height: 44px; border-style: dashed; border-color: var(--semantic-border); box-shadow: none; }

/* tip (Figma 460:1337) */
/* 팁 = shadcn Alert 구조(아이콘 + 제목 + 설명). 아이콘은 lucide, 받침은 기존 파란 계열 타일 */
.tip { background: var(--background); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-xs); padding: 16px; display: grid; grid-template-columns: 36px 1fr; column-gap: 12px; row-gap: 2px; align-items: start; }
.tip-ico { grid-row: span 2; width: 36px; height: 36px; border-radius: 8px; background: var(--accent-bg); color: var(--accent); display: grid; place-items: center; padding: 0; cursor: pointer; }
.tip-title { margin: 0; padding-top: 1px; font-size: 14px; line-height: 20px; font-weight: 600; color: var(--foreground); }
.tip-desc { margin: 0; font-size: 13px; line-height: 20px; color: var(--muted-foreground); }
.side-sec { display: flex; flex-direction: column; gap: 16px; }
.side-sec h2 { margin: 0; }
.flow { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.flow li { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--background); }
.flow-btn { display: flex; gap: 12px; align-items: flex-start; width: 100%; padding: 12px 16px; border: 0; background: none; border-radius: inherit; text-align: left; cursor: pointer; }
.flow li:not([aria-current="step"]) .flow-btn:hover { background: var(--secondary); }
.flow-txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.flow-txt .muted { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.flow li.done > .flow-btn .no { background: var(--foreground); color: var(--primary-foreground); }
.flow-sub { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 8px; }
.items.sub { gap: 6px; }
.items.sub .item { padding: 8px 10px; gap: 8px; }
.items.sub .item .label { font-size: 14px; line-height: 20px; }
.items.sub .item .no { width: 22px; font-size: 13px; line-height: 20px; padding: 0; }
.items.sub .marks { gap: 6px; }
/* 지도 순서: 행을 끌어 놓거나, 손잡이에서 ↑↓ */
.items.sub li.map-sortable { display: flex; flex-direction: row; align-items: center; gap: 2px; border: 0; background: none; }
.items.sub li.map-sortable > .item { flex: 1; min-width: 0; }
.map-grip { flex: none; width: 18px; height: 32px; padding: 0; margin-left: -6px; border: 0; border-radius: 4px; background: none; color: var(--semantic-border); display: grid; place-items: center; cursor: grab; }
.map-grip:hover { background: var(--secondary); color: var(--muted-foreground); }
.map-sortable.dragging { opacity: .4; }
/* 놓을 자리: 카드 사이 틈에 연한 회색 선 (카드 자체엔 표시하지 않음) */
.items.sub li.map-sortable { position: relative; }
.map-sortable.drop-before::before, .map-sortable.drop-after::after { content: ""; position: absolute; left: 16px; right: 0; height: 2px; border-radius: 2px; background: var(--border); }
.map-sortable.drop-before::before { top: -4px; }
.map-sortable.drop-after::after { bottom: -4px; }
.map-grip:focus-visible { outline: 2px solid var(--input); outline-offset: 0; }
.flow-sub .add-map { height: 36px; background: var(--background); }
.flow-btn .no { width: 24px; height: 24px; border-radius: 8px; flex: none; background: var(--secondary); display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--muted-foreground); }
.flow li[aria-current="step"] > .flow-btn .no { background: var(--accent); color: #fff; }
/* 현재 단계 = 공간 유형 카드·지도 행의 선택 표현과 같은 파랑 (accent 테두리 + accent-bg) */
.flow li[aria-current="step"] { border-color: var(--accent); background: var(--accent-bg); }
/* #737373은 accent-bg 위 4.37:1로 AA 미달 → #525252 (7.2:1) */
.flow li[aria-current="step"] .muted { color: #525252; }
/* 아직 오지 않은 단계는 상단 스테퍼처럼 회색으로 — 선택된 것처럼 보이지 않게 */
.flow li:not([aria-current="step"]) { background: #FDFDFD; }
.flow li:not([aria-current="step"]):not(.done) .t-sm-sb { color: var(--muted-foreground); font-weight: 500; }
.progress { font-size: 12px; line-height: 16px; color: var(--muted-foreground); }

/* ── 아래부터 Figma에 없는 컴포넌트 = shadcn/ui 스펙 (Tabs, Card, Badge, Table, AlertDialog, Checkbox, RadioGroup, Sonner, Progress) ── */
/* shadcn Tabs: TabsList bg-muted h-9 p-[3px] rounded-lg / Trigger active bg-background shadow-sm rounded-md */
.tabs { display: inline-flex; align-items: center; gap: 0; height: 36px; padding: 3px; border-radius: var(--radius-lg); background: var(--secondary); max-width: 100%; overflow-x: auto; align-self: flex-start; }
.tab { height: 100%; padding: 4px 12px; border: 1px solid transparent; border-radius: var(--radius-md); background: none; cursor: pointer; font-size: 14px; line-height: 20px; font-weight: 500; color: var(--muted-foreground); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--background); color: var(--foreground); box-shadow: var(--shadow-xs); }
.tab .dot { width: 6px; height: 6px; border-radius: 99px; background: var(--semantic-border); }
.tab .dot.ok { background: var(--accent); }
/* shadcn Card: rounded-xl border shadow-sm, CardHeader px-6 / CardContent px-6 */
.panel { border: 1px solid var(--border); border-radius: 12px; background: var(--background); box-shadow: var(--shadow-xs); }
.panel + .panel { margin-top: 16px; }
.panel-head { display: flex; align-items: center; gap: 10px; padding: 20px 24px 0; flex-wrap: wrap; }
.panel-head h2 { margin: 0; display: flex; align-items: center; gap: 8px; }
.panel-head .spacer { flex: 1; }
.panel-body { padding: 16px 24px 24px; }
/* shadcn Badge: rounded-md px-2 py-0.5 text-xs font-medium — default / outline */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 6px; font-size: 12px; line-height: 16px; font-weight: 500; background: transparent; color: var(--foreground); border: 1px solid var(--border); white-space: nowrap; }
.badge.ok { background: var(--primary); color: var(--primary-foreground); border-color: transparent; }
/* 지도 이름 옆 지도 방식 표시 — 상태가 아니라 정보라서 연한 회색 */
.badge.src-badge { background: var(--secondary); color: var(--foreground); border-color: transparent; }
#tp { display: flex; flex-direction: column; }
.step-no { width: 22px; height: 22px; border-radius: 6px; background: var(--foreground); color: var(--primary-foreground); font-size: 12px; font-weight: 700; display: grid; place-items: center; padding: 0; cursor: pointer; }
.drop { border: 1px dashed var(--semantic-border); border-radius: var(--radius-lg); background: var(--sidebar); padding: 32px 20px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.drop p { margin: 0 0 12px; }

.floorplan { position: relative; aspect-ratio: 16 / 10; max-width: 100%; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--illust-bg); overflow: hidden; cursor: crosshair; }
.floorplan svg { width: 100%; height: 100%; display: block; }
.floorplan.idle { cursor: default; }
.pin { position: absolute; transform: translate(-50%, -50%); display: flex; align-items: center; pointer-events: none; }
.pin b { width: 22px; height: 22px; border-radius: 99px; background: var(--accent); color: #fff; font-size: 12px; display: grid; place-items: center; box-shadow: 0 0 0 3px rgba(47,107,255,.2); }
.pin b { pointer-events: auto; cursor: default; }
/* 이름표는 겹치지 않게 평소엔 숨기고, 핀에 마우스를 올리면 핀 바로 위에 */
.pin span { position: absolute; left: 50%; bottom: calc(100% + 8px); transform: translate(-50%, 4px); font-size: 12px; font-weight: 600; background: #fff; border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; white-space: nowrap; box-shadow: 0 2px 6px rgba(0,0,0,.12); opacity: 0; pointer-events: none; transition: opacity .12s, transform .12s; z-index: 2; }
.pin:has(b:hover) { z-index: 3; }
/* 학습용 안내(1번 사진): 하늘색 카드 + 깜빡이는 안내 문구 + 핀 둘레 파동. 핀 이름표는 계속 보이게 */
.row.coach { background: #eef7ff; border-color: #a9d8ff; }
.coach-tip { color: #1a8cff; font-weight: 600; animation: coach-blink 1.2s ease-in-out infinite; }
.pin.coach { z-index: 3; }
.pin.coach b { animation: coach-ring 1.4s ease-out infinite; }
.pin.coach span { opacity: 1; transform: translate(-50%, 0); background: #eef7ff; border-color: #a9d8ff; }
@keyframes coach-blink { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
@keyframes coach-ring { 0% { box-shadow: 0 0 0 0 rgba(56,170,255,.6); } 100% { box-shadow: 0 0 0 14px rgba(56,170,255,0); } }
.pin:has(b:hover) span { opacity: 1; transform: translate(-50%, 0); }

.grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
.group-h { margin: 16px 0 8px; font-size: 12px; line-height: 16px; font-weight: 600; color: var(--muted-foreground); }
.group-h:first-child { margin-top: 0; }
.shot { border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; background: #fff; }
.shot[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.shot .ph { height: 100px; position: relative; }
.shot .ph .n { position: absolute; left: 8px; top: 8px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 99px; background: rgba(10,10,10,.75); color: #fff; font-size: 12px; font-weight: 600; display: grid; place-items: center; padding: 0; cursor: pointer; }
.shot .ph .cap { position: absolute; left: 10px; bottom: 8px; color: #fff; font-size: 13px; font-weight: 600; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
.shot .meta { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.shot .acts { display: flex; gap: 6px; }
.shot .acts .btn { flex: 1; height: 32px; padding: 0 8px; font-size: 13px; }
.shot .acts .icon-btn { flex: 0 0 32px; width: 32px; }

/* shadcn Table: th h-10 px-2 font-medium text-foreground / td p-2 / tr border-b hover:bg-muted/50 / caption-bottom muted */
.tbl-wrap { position: relative; overflow-x: auto; padding: 8px 16px 16px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; line-height: 20px; caption-side: bottom; }
caption { margin-top: 16px; font-size: 14px; color: var(--muted-foreground); text-align: center; }
th, td { padding: 8px; text-align: left; white-space: nowrap; }
thead th { height: 40px; font-weight: 500; color: var(--foreground); }
tr { border-bottom: 1px solid var(--border); }
tbody tr:last-child { border-bottom: 0; }
tbody tr:hover { background: rgba(245,245,245,.5); }
tbody th { font-weight: 500; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
/* shadcn Progress: h-2 rounded-full bg-primary/20 — 미배치 구간은 빗금으로 색 외 구분 */
.rv-sum { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 0 0 16px; }
.rv-sum > div { background: var(--sidebar); border-radius: var(--radius-lg); padding: 14px 16px; }
.rv-sum dt { font-size: 12px; line-height: 16px; color: var(--muted-foreground); }
.rv-sum dd { margin: 4px 0 0; font-size: 20px; line-height: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
.rv-sum dd span { font-size: 14px; font-weight: 500; color: var(--muted-foreground); }
.rv-sum dd.ok { color: var(--accent); }
.rv-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--border); }
.rv-row { display: grid; grid-template-columns: 24px minmax(0, 1fr) 160px 110px auto; align-items: center; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.rv-no { width: 24px; height: 24px; border-radius: 6px; background: var(--secondary); display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--muted-foreground); }
.rv-main { display: flex; flex-direction: column; min-width: 0; }
.rv-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rv-prog { display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; color: var(--muted-foreground); }
.rv-prog i { flex: 1; height: 6px; border-radius: 99px; background: var(--secondary); overflow: hidden; display: block; }
.rv-prog b { display: block; height: 100%; background: var(--accent); border-radius: inherit; }
.rv-state { font-weight: 600; color: var(--muted-foreground); }
.rv-state.ok { color: var(--accent); }
.rv-go { height: 32px; padding: 0 12px; font-size: 13px; }
.rv-cap { margin: 10px 0 0; }
@media (max-width: 900px) { .rv-row { grid-template-columns: 24px minmax(0, 1fr) auto; row-gap: 8px; } .rv-go { grid-column: 3; grid-row: 1; } .rv-prog { grid-column: 2; grid-row: 2; } .rv-state { grid-column: 3; grid-row: 2; justify-self: end; } .rv-sum dd { font-size: 17px; } }
.radio-row { display: flex; align-items: flex-start; gap: 12px; padding: 14px 0; cursor: pointer; }
/* shadcn RadioGroupItem: size-4 rounded-full border-input shadow-xs, 선택 시 primary 점 */
.radio-row input { appearance: none; width: 16px; height: 16px; margin: 2px 0 0; flex: none; border: 1px solid var(--input); border-radius: 999px; box-shadow: var(--shadow-xs); display: grid; place-items: center; cursor: pointer; }
.radio-row input::after { content: ""; width: 8px; height: 8px; border-radius: 999px; background: var(--primary); transform: scale(0); }
.radio-row input:checked { border-color: var(--primary); }
.radio-row input:checked::after { transform: scale(1); }
/* shadcn Checkbox: size-4 rounded-[4px] border-input, 선택 시 bg-primary + 체크 */
.check-row input { appearance: none; width: 16px; height: 16px; flex: none; border: 1px solid var(--input); border-radius: 4px; box-shadow: var(--shadow-xs); display: grid; place-items: center; cursor: pointer; }
.check-row input:checked { background: var(--primary); border-color: var(--primary); }
.check-row input:checked::after { content: ""; width: 4px; height: 8px; border: solid var(--primary-foreground); border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }
/* 사진 여러 장 선택·삭제 — 체크박스는 shadcn Checkbox와 같은 모양, 일부만 고르면 가로줄(indeterminate) */
.img-ck { appearance: none; width: 16px; height: 16px; flex: none; margin: 0; border: 1px solid var(--input); border-radius: 4px; box-shadow: var(--shadow-xs); display: grid; place-items: center; cursor: pointer; background: var(--background); }
.img-ck:checked, .img-ck:indeterminate { background: var(--primary); border-color: var(--primary); }
.img-ck:checked::after { content: ""; width: 4px; height: 8px; border: solid var(--primary-foreground); border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }
.img-ck:indeterminate::after { content: ""; width: 8px; height: 2px; background: var(--primary-foreground); }
.row.checked { background: var(--secondary); }

/* 하단 액션바 */
.actionbar { position: sticky; bottom: 0; background: var(--background); border-top: 1px solid var(--border); padding: 12px 32px; display: flex; align-items: center; gap: 12px; }
.actionbar .msg { flex: 1; color: var(--muted-foreground); }

/* shadcn AlertDialog: max-w-lg rounded-lg border p-6 shadow-lg, overlay bg-black/50 */
dialog { border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; width: min(512px, calc(100% - 32px)); box-shadow: 0 10px 15px -3px rgba(0,0,0,.1), 0 4px 6px -4px rgba(0,0,0,.1); color: var(--foreground); }
dialog::backdrop { background: rgba(0,0,0,.5); }
dialog h2 { margin: 0 0 8px; font-size: 18px; line-height: 28px; font-weight: 600; }
dialog p { margin: 0 0 16px; color: var(--muted-foreground); }
.dlg-acts { display: flex; justify-content: flex-end; gap: 8px; }
.dlg-acts .btn { border-radius: var(--radius-md); }
/* shadcn Sonner: 우하단, bg-popover border shadow-lg rounded-lg */
.toast { position: fixed; right: 24px; bottom: 84px; min-width: 300px; max-width: calc(100% - 32px); background: var(--background); color: var(--foreground); border: 1px solid var(--border); box-shadow: 0 4px 12px rgba(0,0,0,.1); padding: 14px 16px; border-radius: var(--radius-lg); font-size: 14px; line-height: 20px; font-weight: 500; opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .2s; pointer-events: none; z-index: 30; }
.toast.show { opacity: 1; transform: none; }
.input:focus-visible { box-shadow: 0 0 0 3px rgba(161,161,161,.5); border-color: var(--semantic-border); }

/* 모바일 지도 목록: 데스크톱에선 사이드바가 같은 역할을 하므로 숨김 */
.m-maps { display: none; }
@media (max-width: 900px) {
  .nav { padding: 0 16px; }
  .shell { flex-direction: column; }
  /* 사이드바를 위에 쌓으면 본문이 밀리고 하단 바와 겹친다 → 모바일에선 숨기고 본문 안 가로 칩 목록으로 대신 */
  .sidebar { display: none; }
  .gnb { padding: 0 16px; }
  .stepform { padding: 20px 16px 0; gap: 20px; }
  .stepform.body { padding: 20px 16px calc(140px + env(safe-area-inset-bottom, 0px)); }
  .stepper li { font-size: 13px; }
  .t-3xl { font-size: 22px; line-height: 32px; }
  /* 하단 바는 화면 맨 아래에 고정, 안내 문구는 버튼 위 한 줄 */
  .actionbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; flex-wrap: wrap; gap: 8px 12px;
    padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    box-shadow: 0 -4px 12px rgba(0,0,0,.06); }
  .actionbar .msg { order: -1; flex: 1 0 100%; font-size: 12px; line-height: 16px; }
  .actionbar .msg:empty { display: none; }
  .actionbar .btn-lg { height: 48px; }
  #nextBtn { flex: 1; }
  .toast { left: 16px; right: 16px; min-width: 0; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
  /* 위아래 여백 = 칩을 집어 손을 따라 움직일 때 잘리지 않을 공간(바깥 여백을 그만큼 빼서 배치는 그대로) */
  .m-maps { display: flex; gap: 8px; overflow-x: auto; margin: -10px -16px 6px; padding: 12px 16px 14px; scrollbar-width: none; }
  .m-maps::-webkit-scrollbar { display: none; }
  .m-chip { flex: none; display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border: 1px solid var(--border); border-radius: 999px; background: var(--background); font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .m-chip[aria-current="true"] { border-color: var(--foreground); background: var(--foreground); color: var(--primary-foreground); }
  .m-chip .cnt { font-size: 12px; font-weight: 500; opacity: .8; }
  .m-chip.add { border-style: dashed; border-color: var(--semantic-border); font-weight: 500; }
  /* 칩 순서 바꾸기: 마우스는 끌면 바로, 터치는 길게 눌러 집은 뒤 끈다(짧게 밀면 그냥 가로 스크롤) */
  .m-chip[data-mc] { touch-action: pan-x; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .m-chip.lifting { position: relative; z-index: 2; cursor: grabbing; box-shadow: 0 6px 16px rgba(0,0,0,.18); transition: none; }
  .panel-head { padding: 16px 16px 0; }
  .panel-body { padding: 12px 16px 16px; }
  .title-hint { margin: 4px 16px 0; }
  .name-chips { margin: 8px 16px 0; }
  .src-card { padding: 18px; }
  .ws { grid-template-columns: 1fr; grid-template-areas: "mh" "map" "lh" "list"; }
  .ws-lhead { margin-top: 12px; }
  .ws-list { height: auto; min-height: 0; }
  .type-card { width: 100%; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } .coach-tip, .pin.coach b { animation: none; } }
</style>
</head>
<body>
<a class="skip" href="#content">본문으로 건너뛰기</a>

<header class="nav">
  <span class="logo" role="img" aria-label="VT PARTNERS Admin">
    <img src="assets/logo-vtpartners.svg" width="134.478" height="14.5235" alt="">
    <img src="assets/logo-admin.svg" width="41.481" height="10.582" alt="" style="margin-top:2px">
  </span>
  <button class="avatar" type="button" aria-label="사용자 메뉴"><img src="assets/user-round.svg" width="20" height="20" alt="" style="display:block"></button>
</header>

<div class="shell">
  <aside class="sidebar" id="sidebar" aria-label="등록 현황"></aside>

  <main class="main">
    <div class="gnb">

<script>

  entrance: { lat: 37.835722, lng: 126.735445 }, living: { lat: 37.835917, lng: 126.735388 }, bedroom: { lat: 37.835917, lng: 126.735388 },

// maps: 방문자 화면의 미니맵 한 장 = 지도 하나. 층·구역 구분 없이 이름은 관리자가 붙인다
const state = { step: 0, name: '', scale: null, maps: [], active: 0, sel: null, cursor: { x: 50, y: 50 }, vis: 'private', touched: false, nameTouched: false, checked: new Set() };
let uid = 1;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// source: 'naver' = 360이미지 GPS로 실제 지도 불러오기(권장) / 'upload' = 평면도·안내도 직접 올리기

// 네이버 클라우드 플랫폼 Maps Client ID. 등록한 서비스 URL(도메인)에서만 동작하는 공개용 키다.
// 비워 두거나 인증에 실패하면 예시 지도로 대신 보여준다.
const NAVER_KEY = '1xdhtvv4d4';
const nv = { status: 'none' }; // none | nokey | loading | ready | failed(인증 실패) | blocked(스크립트를 못 불러옴)
const DEFAULT_LL = { lat: 37.5666, lng: 126.9784 };
const isReal = m => m.source === 'naver' && nv.status === 'ready';
// 시안용 GPS 좌표(지도 위 %). 3장 중 1장은 GPS가 없는 사진으로 가정
const GPS = [[24, 58], [32, 68], [30, 60], [64, 30], [74, 38], [70, 34], [56, 74], [46, 80]];
// 네이버 지도면 GPS가 있는 사진은 자동으로 위치가 찍힌다
function autoPin(m) {
  if (m.source !== 'naver') return 0;
  let k = 0;
  const real = isReal(m), lls = m.images.filter(i => i.ll).map(i => i.ll);
  // 예시 지도일 때 실제 사진의 GPS는 사진들끼리의 상대 위치로 펼쳐 보여준다
  const box = lls.length && {
    a: Math.min(...lls.map(l => l.lat)), b: Math.max(...lls.map(l => l.lat)),
    c: Math.min(...lls.map(l => l.lng)), d: Math.max(...lls.map(l => l.lng)) };

  m.images.forEach(i => {
    if (i.pin) return;
    if (real && i.ll) i.pin = { lat: i.ll.lat, lng: i.ll.lng };
    else if (!real && i.gps) i.pin = { x: i.gps[0], y: i.gps[1] };
    else if (!real && i.ll) i.pin = { x: rel(i.ll.lng, box.c, box.d), y: 100 - rel(i.ll.lat, box.a, box.b) };

}
// 학습용 안내: 처음 사진이 자동으로 찍히면 1번 사진의 카드·핀을 하늘색으로 깜빡여 '위치 확인·바꾸기'를 알려 준다. 위치를 한 번 만지면 끝
function coachFirst(m) { if (state.coachDone || m.coach) return; const f = m.images[0]; if (f?.pin) m.coach = f.id; }
const endCoach = () => { state.coachDone = true; state.maps.forEach(x => { x.coach = null; }); };
function loadNaver() {
  if (nv.status !== 'none') return;

  const same = {}; pts.forEach(i => (same[spot(i)] ||= []).push(i));

  arrowUpDown: '<path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/>',

/* ── 사이드바: 모든 단계에서 같은 단계 카드. 현재 단계 카드가 펼쳐지고, 지난 단계는 입력한 내용을 요약 ── */

// Figma 460:1446 벡터 배치 그대로 (inset %)

  render(); toast(`‘${img.name}’ 위치를 찍었어요${nx ? ` · 다음은 ‘${nx.name}’` : ''}`); $('#plan')?.focus();
}
// 실제 파일: 360이미지는 EXIF GPS를 읽고, 평면도는 내 컴퓨터 이미지를 그대로 보여준다
async function addFiles(files) {
  const m = cur(), imgs = files.filter(f => /^image\/(jpeg|png)$/.test(f.type));
  if (!imgs.length) { toast('JPG·PNG 이미지만 올릴 수 있어요. 다른 파일을 골라주세요'); return; }
  toast('사진을 읽는 중이에요…');
  for (const f of imgs) {
    let ll = null;
    try { const g = await window.exifr?.gps(f); if (g && isFinite(g.latitude) && isFinite(g.longitude)) ll = { lat: g.latitude, lng: g.longitude }; } catch (_) {}
    m.images.push({ id: uid++, name: f.name.replace(/\.[^.]+$/, ''), url: URL.createObjectURL(f), pin: null, gps: null, ll });
  }
  const withGps = imgs.length && m.images.slice(-imgs.length).filter(i => i.ll).length;
  const k = autoPin(m); coachFirst(m); render(); $('#addImg')?.focus();
  toast(m.source === 'naver'
    ? (k ? `${imgs.length}장을 추가했어요. ${k}장은 촬영 위치로 찍혔어요` : `${imgs.length}장을 추가했어요. 사진에 촬영 위치가 없어서 위치를 직접 찍어주세요`)
    : `${imgs.length}장을 추가했어요${withGps ? ` · 촬영 위치가 있는 사진 ${withGps}장` : ''}`);
}
function setPlan(f) {
  if (!/^image\/(jpeg|png)$/.test(f.type)) { toast('PNG·JPG 이미지만 올릴 수 있어요'); return; }
  if (f.size > 20 * 1024 * 1024) { toast('20MB가 넘는 이미지는 올릴 수 없어요. 용량을 줄여서 다시 올려주세요'); return; }
  const m = cur(); m.planUrl = URL.createObjectURL(f); m.map = true; render(); toast('평면도를 올렸어요'); $('#addImg').focus();
}
// 지도 순서 바꾸기. 보고 있던 지도는 그대로 열어 둔다
function moveMap(from, to) {
  const ms = state.maps; to = Math.max(0, Math.min(ms.length - 1, to));
  if (from === to) return false;
  const open = cur(), [m] = ms.splice(from, 1); ms.splice(to, 0, m); state.active = ms.indexOf(open);
  render(); toast(`‘${dn(m)}’ 지도를 ${to + 1}번째로 옮겼어요`); return true;
}
let dragFrom = null;
const clearDrop = () => document.querySelectorAll('.drop-before, .drop-after').forEach(el => el.classList.remove('drop-before', 'drop-after'));
document.addEventListener('dragstart', e => {
  const li = e.target.closest?.('[data-mi]'); if (!li) return;
  dragFrom = +li.dataset.mi; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(dragFrom)); li.classList.add('dragging');
});
document.addEventListener('dragover', e => {
  const li = dragFrom !== null && e.target.closest?.('[data-mi]'); if (!li) return;
  e.preventDefault(); e.dataTransfer.dropEffect = 'move'; clearDrop();
  const r = li.getBoundingClientRect(); li.classList.add(e.clientY < r.top + r.height / 2 ? 'drop-before' : 'drop-after');
});
document.addEventListener('drop', e => {
  const li = dragFrom !== null && e.target.closest?.('[data-mi]'); if (!li) return;
  e.preventDefault(); let to = +li.dataset.mi + (li.classList.contains('drop-after') ? 1 : 0); if (dragFrom < to) to--;
  const from = dragFrom; dragFrom = null; clearDrop(); moveMap(from, to);
});
document.addEventListener('dragend', () => { dragFrom = null; clearDrop(); document.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging')); });
// 키보드: 손잡이에 포커스를 두고 ↑↓로 한 칸씩
document.addEventListener('keydown', e => {
  if (!e.target.dataset?.grip || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;
  e.preventDefault(); const i = +e.target.dataset.grip, to = i + (e.key === 'ArrowUp' ? -1 : 1);
  if (moveMap(i, to)) $(`[data-grip="${Math.max(0, Math.min(state.maps.length - 1, to))}"]`)?.focus();
});
document.addEventListener('dragover', e => { if (e.target.closest?.('[data-drop]')) { e.preventDefault(); e.target.closest('[data-drop]').classList.add('over'); } });
document.addEventListener('dragleave', e => e.target.closest?.('[data-drop]')?.classList.remove('over'));
document.addEventListener('drop', e => {
  const z = e.target.closest?.('[data-drop]'); if (!z) return;
  e.preventDefault(); z.classList.remove('over');
  const files = [...e.dataTransfer.files];
  if (z.dataset.drop === 'plan') files[0] && setPlan(files[0]); else addFiles(files);
});
function pin(x, y) {
  const m = cur(), img = m.images.find(i => i.id === state.sel);
  img.pin = { x: Math.max(6, Math.min(90, x)), y: Math.max(8, Math.min(92, y)) }; img.auto = false;
  const nx = m.images.find(i => !i.pin); state.sel = nx ? nx.id : null; state.cursor = { x: 50, y: 50 };
  render(); toast(`‘${img.name}’ 위치를 찍었어요${nx ? ` · 다음은 ‘${nx.name}’` : ''}`); $('#plan')?.focus();
}

/* AlertDialog: 네이티브 dialog로 포커스 트랩·Esc, 닫히면 원래 버튼으로 포커스 복귀 */
let onOk = null, back = null;
function confirmBox(title, desc, opener, ok, okLabel = '삭제하기', danger = true) {
  $('#dlgT').textContent = title; $('#dlgD').textContent = desc;
  $('#dlgOk').textContent = okLabel; $('#dlgOk').className = 'btn ' + (danger ? 'btn-destructive' : 'btn-primary');
  onOk = ok; back = opener;
  $('#dlg').showModal(); $('#dlgCancel').focus();
}
$('#dlgCancel').onclick = () => $('#dlg').close();
$('#dlgOk').onclick = () => { back = null; $('#dlg').close(); onOk?.(); };
$('#dlg').addEventListener('close', () => back?.focus());

$('#nextBtn').onclick = () => {
  if (state.step === 0 && blocker()) { state.touched = true; render(); (!state.name.trim() ? $('#nameInput') : $('input[name="scale"]')).focus(); return; }
  if (state.step === 1 && needsName()) {
    const i = state.maps.findIndex(m => !named(m));
    if (i >= 0) { state.nameTouched = true; openMap(i, '#mapName'); toast('방문자에게 보일 지도 이름을 붙여주세요'); return; }
  }
  if (state.step === 2 && noImages()) { toast('360이미지를 1장 이상 추가해주세요'); return; }
  if (state.step === 2) { location.replace('edit.html?new=1&name=' + encodeURIComponent(state.name)); return; }
  go(state.step + 1);
};
let tt;
function toast(m) { const el = $('#toast'); el.textContent = m; el.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 2400); }

render();
</script>
</body>
